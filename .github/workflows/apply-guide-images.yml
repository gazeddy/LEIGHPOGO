name: Apply guide image feature

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guide-images-service-rename
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch existing guide workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "lib/guides.ts",
              "  relatedGuides?: string[];\n}",
              "  relatedGuides?: string[];\n  coverImage?: string;\n  coverImageAlt?: string;\n}",
          )
          replace_once(
              "lib/guides.ts",
              "  const relatedGuides = normaliseSlugArray(data.relatedGuides)?.filter(\n    (relatedSlug) => relatedSlug !== slug,\n  );\n",
              "  const relatedGuides = normaliseSlugArray(data.relatedGuides)?.filter(\n    (relatedSlug) => relatedSlug !== slug,\n  );\n  const coverImage =\n    typeof data.coverImage === \"string\" && data.coverImage.trim()\n      ? data.coverImage.trim()\n      : undefined;\n  const coverImageAlt =\n    typeof data.coverImageAlt === \"string\" && data.coverImageAlt.trim()\n      ? data.coverImageAlt.trim()\n      : undefined;\n",
          )
          replace_once(
              "lib/guides.ts",
              "  if (relatedGuides && relatedGuides.length > 0) {\n    frontMatter.relatedGuides = relatedGuides;\n  }\n\n  return frontMatter;",
              "  if (relatedGuides && relatedGuides.length > 0) {\n    frontMatter.relatedGuides = relatedGuides;\n  }\n\n  if (coverImage) {\n    frontMatter.coverImage = coverImage;\n    frontMatter.coverImageAlt = coverImageAlt || frontMatter.title;\n  }\n\n  return frontMatter;",
          )

          replace_once(
              "pages/guides/[slug].tsx",
              "      <MarkdownContent content={guide.content} />",
              "      {guide.coverImage && (\n        <figure className=\"guide-cover\">\n          <img\n            src={guide.coverImage}\n            alt={guide.coverImageAlt || guide.title}\n            loading=\"eager\"\n            decoding=\"async\"\n          />\n        </figure>\n      )}\n\n      <MarkdownContent content={guide.content} />",
          )
          replace_once(
              "pages/guides/[slug].tsx",
              "        .series-position {",
              "        .guide-cover {\n          margin: 0;\n          border-top: 1px solid #30363d;\n          border-bottom: 1px solid #30363d;\n          background: #0d1117;\n        }\n\n        .guide-cover img {\n          display: block;\n          width: 100%;\n          max-height: 540px;\n          object-fit: cover;\n        }\n\n        .series-position {",
          )

          replace_once(
              "pages/api/admin/content/guides.ts",
              "  relatedGuides?: unknown;\n  body?: unknown;",
              "  relatedGuides?: unknown;\n  coverImage?: unknown;\n  coverImageAlt?: unknown;\n  body?: unknown;",
          )
          replace_once(
              "pages/api/admin/content/guides.ts",
              "function stringArray(value: unknown): string[] {",
              "function validateImageUrl(value: unknown): string | undefined {\n  const image = optionalString(value);\n\n  if (!image) {\n    return undefined;\n  }\n\n  if (image.startsWith(\"/uploads/guides/\")) {\n    return image;\n  }\n\n  let parsed: URL;\n\n  try {\n    parsed = new URL(image);\n  } catch {\n    throw new Error(\"Cover image must be a valid local or web URL\");\n  }\n\n  if (![\"http:\", \"https:\"].includes(parsed.protocol)) {\n    throw new Error(\"Cover image must use HTTP or HTTPS\");\n  }\n\n  return parsed.toString();\n}\n\nfunction stringArray(value: unknown): string[] {",
          )
          replace_once(
              "pages/api/admin/content/guides.ts",
              "  relatedGuides: string[];\n  body: string;",
              "  relatedGuides: string[];\n  coverImage?: string;\n  coverImageAlt?: string;\n  body: string;",
          )
          replace_once(
              "pages/api/admin/content/guides.ts",
              "  if (input.order !== undefined) {",
              "  if (input.coverImage) {\n    frontMatter.push(`coverImage: ${yamlString(input.coverImage)}`);\n    frontMatter.push(`coverImageAlt: ${yamlString(input.coverImageAlt || input.title)}`);\n  }\n\n  if (input.order !== undefined) {",
          )
          replace_once(
              "pages/api/admin/content/guides.ts",
              "  const order = optionalWholeNumber(input.order, \"Order\", 0);\n  const relationships = validateRelationships(input, slug);",
              "  const order = optionalWholeNumber(input.order, \"Order\", 0);\n  const coverImage = validateImageUrl(input.coverImage);\n  const coverImageAlt = optionalString(input.coverImageAlt);\n\n  if (coverImage && !coverImageAlt) {\n    throw new Error(\"Cover image alternative text is required\");\n  }\n\n  const relationships = validateRelationships(input, slug);",
          )
          replace_once(
              "pages/api/admin/content/guides.ts",
              "    tags: stringArray(input.tags),\n    ...relationships,",
              "    tags: stringArray(input.tags),\n    coverImage,\n    coverImageAlt,\n    ...relationships,",
          )

          replace_once(
              "pages/admin/content.tsx",
              'import { useMemo, useState, type FormEvent, type KeyboardEvent } from "react";',
              'import { useMemo, useRef, useState, type FormEvent, type KeyboardEvent } from "react";\nimport GuideImageUploader from "../../components/admin/GuideImageUploader";',
          )
          replace_once(
              "pages/admin/content.tsx",
              "    relatedGuides: [] as string[],\n    body:",
              "    relatedGuides: [] as string[],\n    coverImage: \"\",\n    coverImageAlt: \"\",\n    body:",
          )
          replace_once(
              "pages/admin/content.tsx",
              "  const [slugTouched, setSlugTouched] = useState(false);",
              "  const [slugTouched, setSlugTouched] = useState(false);\n  const guideBodyRef = useRef<HTMLTextAreaElement | null>(null);",
          )
          replace_once(
              "pages/admin/content.tsx",
              "    if (guideForm.order) {",
              "    if (guideForm.coverImage) {\n      lines.push(`coverImage: ${yamlString(guideForm.coverImage)}`);\n      lines.push(\n        `coverImageAlt: ${yamlString(guideForm.coverImageAlt || guideForm.title || \"Guide cover\")}`,\n      );\n    }\n\n    if (guideForm.order) {",
          )
          replace_once(
              "pages/admin/content.tsx",
              "          relatedGuides: guideForm.relatedGuides,\n        },",
              "          relatedGuides: guideForm.relatedGuides,\n          coverImage: guideForm.coverImage || undefined,\n          coverImageAlt: guideForm.coverImageAlt || undefined,\n        },",
          )
          replace_once(
              "pages/admin/content.tsx",
              "            <label>\n              Guide body (Markdown)",
              "            <GuideImageUploader\n              body={guideForm.body}\n              onBodyChange={(body) =>\n                setGuideForm((current) => ({ ...current, body }))\n              }\n              coverImage={guideForm.coverImage}\n              coverImageAlt={guideForm.coverImageAlt}\n              onCoverChange={(coverImage, coverImageAlt) =>\n                setGuideForm((current) => ({\n                  ...current,\n                  coverImage,\n                  coverImageAlt,\n                }))\n              }\n              textareaRef={guideBodyRef}\n            />\n\n            <label>\n              Guide body (Markdown)",
          )
          replace_once(
              "pages/admin/content.tsx",
              "              <textarea\n                required\n                rows={18}",
              "              <textarea\n                ref={guideBodyRef}\n                required\n                rows={18}",
          )

          replace_once(
              "components/Navbar.js",
              "                    <Link href=\"/admin/guide-links\" className=\"nav-item nav-subitem\">\n                      Guide Links\n                    </Link>",
              "                    <Link href=\"/admin/guide-links\" className=\"nav-item nav-subitem\">\n                      Guide Links\n                    </Link>\n                    <Link href=\"/admin/guide-images\" className=\"nav-item nav-subitem\">\n                      Guide Pictures\n                    </Link>",
          )

          replace_once(
              ".gitignore",
              "/data/event-type-rules.json*\n",
              "/data/event-type-rules.json*\n/public/uploads/guides/*\n",
          )

          uploader = Path("components/admin/GuideImageUploader.tsx")
          source = uploader.read_text()
          source = source.replace(
              "        .guide-image-uploader { gap: 12px; }",
              "        .guide-image-uploader { display: grid; gap: 12px; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }\n        .guide-image-uploader label { display: grid; gap: 7px; color: #f0f6fc; font-weight: 700; }\n        .guide-image-uploader input { width: 100%; box-sizing: border-box; border: 1px solid #30363d; border-radius: 7px; padding: 10px; background: #0d1117; color: #f0f6fc; font: inherit; }\n        .field-help { margin: 0 0 4px; color: #8b949e; font-size: .86rem; font-weight: 400; line-height: 1.5; }",
              1,
          )
          uploader.write_text(source)

          readme = Path("README.md")
          readme.write_text(readme.read_text() + '''

## Guide image storage

Admin guide images are stored under `public/uploads/guides` by default. The folder contents are ignored by Git so `git pull`, `npm ci` and application builds do not remove uploaded pictures. Back this directory up alongside the guide Markdown files. Set `GUIDE_UPLOADS_DIRECTORY` and `GUIDE_UPLOADS_URL_PREFIX` only when using a different persistent storage location.

## Renaming the systemd services

After deploying this update, rename and verify both application services with:

```bash
sudo bash deploy/rename-systemd-services.sh
```

The script starts and verifies `leighpogo.service` and `leighpogo-test.service` before disabling and deleting `pokego-backend.service` and `pokego-test.service`. If a replacement fails to start, the old service is left in place.
''')

          Path(".github/workflows/apply-guide-images.yml").unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate guide image wiring
        shell: bash
        run: |
          grep -q 'coverImage?: string' lib/guides.ts
          grep -q 'GuideImageUploader' pages/admin/content.tsx
          grep -q 'Guide Pictures' components/Navbar.js
          grep -q 'public/uploads/guides' .gitignore
          grep -q 'leighpogo-test' deploy/rename-systemd-services.sh
          test ! -e .github/workflows/apply-guide-images.yml

      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add guide picture management and service rename"
          git push origin HEAD:feature/guide-images-service-rename
