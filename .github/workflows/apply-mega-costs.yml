name: Apply Mega Evolution costs

on:
  push:
    branches:
      - agent/add-mega-evolution-costs

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Mega Evolution patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/mega-costs.patch
          git apply /tmp/mega-costs.patch
          rm -f .github/workflows/export-source.yml .github/workflows/apply-mega-costs.yml
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --runInBand --passWithNoTests
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Mega Evolution energy costs"
          git push origin HEAD:agent/add-mega-evolution-costs
