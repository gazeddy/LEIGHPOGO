name: Validate ticker resume

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build

      - name: Verify ticker interaction implementation
        run: |
          set -euo pipefail
          grep -F 'const AUTO_RESUME_DELAY_MS = 3000' components/events/EventTicker.tsx
          grep -F 'if (!usedActionLink && wasPaused && pressDuration <= TAP_MAX_DURATION_MS)' components/events/EventTicker.tsx
          grep -F 'scheduleResume();' components/events/EventTicker.tsx
          grep -F '.event-ticker.paused .ticker-track' components/events/EventTicker.tsx
          ! grep -F '.event-ticker:hover .ticker-track' components/events/EventTicker.tsx
          ! grep -F '.event-ticker:focus-within .ticker-track' components/events/EventTicker.tsx
