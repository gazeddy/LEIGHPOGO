name: Validate unified guide editor

on:
  push:
    branches:
      - feature/unified-guide-editor
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./prisma/ci.db
      NEXTAUTH_SECRET: guide-editor-validation-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run guide editor regression tests
        run: npm test -- --runInBand __tests__/admin/unified-guide-editor.test.js

      - name: Build production application
        run: npm run build
