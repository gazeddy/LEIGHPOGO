name: Capture page screenshots

on:
  pull_request:
    branches: [develop]

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/screenshots.db
      NEXTAUTH_SECRET: screenshot-preview-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma db push

      - name: Create preview admin account
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const prisma = new PrismaClient();

          (async () => {
            const password = await bcrypt.hash('test', 10);
            await prisma.user.upsert({
              where: { ign: 'Angryspanner' },
              update: { password, role: 'admin' },
              create: {
                name: 'Angryspanner',
                ign: 'Angryspanner',
                password,
                role: 'admin',
              },
            });
          })()
            .finally(() => prisma.$disconnect());
          NODE

      - name: Create representative preview events
        run: |
          mkdir -p data
          node <<'NODE'
          const fs = require('node:fs');

          const fetchedAt = new Date().toISOString();
          const events = {
            version: 1,
            fetchedAt,
            events: [
              {
                eventID: 'preview-gmax-rillaboom',
                name: 'Gigantamax Rillaboom Max Battle Day',
                eventType: 'max-battles',
                heading: 'Max Battle Day',
                link: 'https://leekduck.com/events/',
                image: null,
                start: '2026-08-01T14:00:00+01:00',
                end: '2026-08-01T17:00:00+01:00',
                tags: ['max', 'gmax', 'rillaboom'],
                description: null,
                campfireUrl: null,
                source: 'feed'
              },
              {
                eventID: 'preview-community-day',
                name: 'Rookidee Community Day',
                eventType: 'community-day',
                heading: 'Community Day',
                link: 'https://leekduck.com/events/',
                image: null,
                start: '2026-08-09T14:00:00+01:00',
                end: '2026-08-09T17:00:00+01:00'
              },
              {
                eventID: 'preview-raid-hour',
                name: 'Rayquaza Raid Hour',
                eventType: 'raid-hour',
                heading: 'Raid Hour',
                link: 'https://leekduck.com/events/',
                image: null,
                start: '2026-08-12T18:00:00+01:00',
                end: '2026-08-12T19:00:00+01:00'
              }
            ]
          };

          const localEvents = [
            {
              id: 'local-leigh-rillaboom-preview',
              name: 'Leigh Gigantamax Rillaboom Meetup',
              eventType: 'max-battles',
              heading: 'Leigh Meetup',
              description: 'Meet the local group before the Max Battle Day begins.',
              start: '2026-08-01T13:30:00+01:00',
              end: '2026-08-01T17:30:00+01:00',
              campfireUrl: 'https://campfire.nianticlabs.com/',
              image: null,
              tags: ['max', 'gmax', 'rillaboom', 'meetup'],
              createdAt: fetchedAt,
              updatedAt: fetchedAt
            }
          ];

          fs.writeFileSync('data/events-cache.json', JSON.stringify(events, null, 2));
          fs.writeFileSync('data/local-events.json', JSON.stringify(localEvents, null, 2));
          NODE

      - run: npm run build

      - name: Install Chromium capture tools
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start > /tmp/leighpogo.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leighpogo.log
          exit 1

      - name: Capture pages
        run: node .github/scripts/capture-pages.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: leighpogo-page-screenshots
          path: screenshots/*.png
          if-no-files-found: error
