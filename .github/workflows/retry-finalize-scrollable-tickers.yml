name: Retry finalized scrollable tickers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Prepare corrected finalization scripts
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              '.github/workflows/finalize-scrollable-tickers.yml'
          ).read_text(encoding='utf-8')

          def extract_step(name, next_name):
              start_marker = f'      - name: {name}\n        run: |\n'
              end_marker = f'\n      - name: {next_name}'
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              return dedent(workflow[start:end])

          apply_script = extract_step(
              'Apply scrollable ticker implementation',
              'Clean generated ticker sources',
          )
          clean_script = extract_step(
              'Clean generated ticker sources',
              'Update ticker regression tests',
          )
          test_script = extract_step(
              'Update ticker regression tests',
              'Install dependencies',
          ).replace(
              'expect(raidTicker).toContain(".raid-group-duplicate");',
              'expect(raidTicker).toContain("raid-group-duplicate");',
          )

          Path('/tmp/apply-step.sh').write_text(apply_script, encoding='utf-8')
          Path('/tmp/clean-step.sh').write_text(clean_script, encoding='utf-8')
          Path('/tmp/test-step.sh').write_text(test_script, encoding='utf-8')
          PY

      - name: Apply scrollable ticker implementation
        run: bash /tmp/apply-step.sh

      - name: Clean generated ticker sources
        run: bash /tmp/clean-step.sh

      - name: Update corrected regression tests
        run: bash /tmp/test-step.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Remove temporary workflows
        run: |
          rm -f \
            .github/workflows/temporary-inspect-tickers.yml \
            .github/workflows/apply-scrollable-tickers.yml \
            .github/workflows/debug-scrollable-tickers.yml \
            .github/workflows/finalize-scrollable-tickers.yml \
            .github/workflows/retry-finalize-scrollable-tickers.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components styles __tests__ .github/workflows
          git commit -m "Make tickers manually scrollable"
          git push origin HEAD:develop
