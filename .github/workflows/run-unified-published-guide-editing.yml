name: Run unified published guide editing fix

on:
  push:
    branches: [fix/unified-published-guide-editing]
    paths:
      - .github/workflows/run-unified-published-guide-editing.yml

permissions:
  contents: write

jobs:
  apply-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-published-guide-editing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply published guide editor fix
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-unified-published-guide-editing.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end]
          )
          Path('/tmp/apply-published-guide-editing.py').write_text(script + '\n')
          PY
          python /tmp/apply-published-guide-editing.py

      - name: Install dependencies
        run: npm ci

      - name: Run targeted editor tests
        run: npm test -- --runInBand __tests__/admin/unified-guide-editor.test.js

      - name: Build application
        run: npm run build

      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/admin/unified-guide-editor.test.js pages/admin/content.tsx pages/admin/guide-images.tsx pages/admin/guide-links.tsx pages/guides/'[slug].tsx'
          git commit -m "Fix editing of published guides"
          git push origin HEAD:fix/unified-published-guide-editing
