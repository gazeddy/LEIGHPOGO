name: Apply prepared Pokédex regional changes

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-regional-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Recover and run prepared patch
        run: |
          git show HEAD^:.github/workflows/apply-pokedex-regional-admin.yml > /tmp/prepared-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/prepared-workflow.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-regional.py').write_text(script)
          PY
          python /tmp/apply-regional.py

      - name: Commit prepared source changes
        run: |
          git rm .github/workflows/apply-pokedex-regional-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/pokemonRegionalStore.js \
            pages/api/admin/pokemon-regional-overrides.js \
            components/admin/PokemonRegionalAdmin.js \
            prisma/schema.prisma \
            prisma/migrations/20260803155000_add_pokemon_regional_overrides/migration.sql \
            pages/admin/pokedex.js \
            components/PokedexCatalogFetchGuard.js \
            pages/api/pokedex-catalog.js \
            pages/pokedex.js \
            __tests__/pokedex-catalog-client-cache.test.js \
            __tests__/lib/pokemonRegionalStore.test.js \
            __tests__/pokedex-regional-admin.test.js
          git commit -m "Add Pokédex regional administration"
          git push origin HEAD:develop
