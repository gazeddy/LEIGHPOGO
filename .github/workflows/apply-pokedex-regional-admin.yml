name: Apply Pokédex regional administration

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-regional-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./regional-validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply regional administration changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              content = file_path.read_text()
              if old not in content:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              file_path.write_text(content.replace(old, new, 1))

          Path("lib/pokemonRegionalStore.js").write_text(r'''const fs = require("fs/promises");
const path = require("path");
const prisma = require("./prisma");

const runtimeFilePath = () =>
  process.env.POKEMON_REGIONAL_OVERRIDES_PATH ||
  path.join(process.cwd(), "data", "pokemon-regional-overrides.json");

let databaseUnavailable = false;

function normaliseDexNumber(value) {
  const dexNumber = Number(value);
  return Number.isInteger(dexNumber) && dexNumber > 0 ? dexNumber : null;
}

function optionalNote(value) {
  if (typeof value !== "string") return null;
  const note = value.trim();
  return note ? note.slice(0, 500) : null;
}

function normaliseRegions(value) {
  let values = value;
  if (typeof values === "string") {
    const trimmed = values.trim();
    if (!trimmed) return [];
    try {
      const parsed = JSON.parse(trimmed);
      values = Array.isArray(parsed) ? parsed : trimmed.split(",");
    } catch {
      values = trimmed.split(",");
    }
  }

  if (!Array.isArray(values)) return [];

  const seen = new Set();
  const regions = [];
  for (const item of values) {
    if (typeof item !== "string") continue;
    const region = item.trim().slice(0, 80);
    const key = region.toLowerCase();
    if (!region || seen.has(key)) continue;
    seen.add(key);
    regions.push(region);
    if (regions.length >= 20) break;
  }
  return regions;
}

function normaliseRegionalOverride(value) {
  const dexNumber = normaliseDexNumber(value?.dexNumber);
  if (dexNumber === null || typeof value?.isRegional !== "boolean") return null;

  let createdAt = null;
  let updatedAt = null;
  try {
    if (value.createdAt) createdAt = new Date(value.createdAt).toISOString();
    if (value.updatedAt) updatedAt = new Date(value.updatedAt).toISOString();
  } catch {
    createdAt = null;
    updatedAt = null;
  }

  return {
    dexNumber,
    isRegional: value.isRegional,
    regions: value.isRegional ? normaliseRegions(value.regions) : [],
    note: optionalNote(value.note),
    createdAt,
    updatedAt,
  };
}

function databaseModel() {
  return prisma?.pokemonRegionalOverride;
}

function isUnavailableDatabaseError(error) {
  return (
    !databaseModel()?.findMany ||
    ["P2021", "P2022"].includes(error?.code) ||
    /PokemonRegionalOverride|pokemonRegionalOverride|no such table|does not exist/i.test(
      String(error?.message || "")
    )
  );
}

async function readFileOverrides() {
  try {
    const parsed = JSON.parse(await fs.readFile(runtimeFilePath(), "utf8"));
    return (Array.isArray(parsed) ? parsed : [])
      .map(normaliseRegionalOverride)
      .filter(Boolean)
      .sort((left, right) => left.dexNumber - right.dexNumber);
  } catch (error) {
    if (error.code === "ENOENT" || error instanceof SyntaxError) return [];
    throw error;
  }
}

async function writeFileOverrides(overrides) {
  const filePath = runtimeFilePath();
  const temporaryPath = `${filePath}.${process.pid}.${Date.now()}.tmp`;
  await fs.mkdir(path.dirname(filePath), { recursive: true });
  try {
    await fs.writeFile(
      temporaryPath,
      `${JSON.stringify(overrides, null, 2)}\n`,
      "utf8"
    );
    await fs.rename(temporaryPath, filePath);
  } finally {
    await fs.unlink(temporaryPath).catch(() => undefined);
  }
}

async function readPokemonRegionalOverrides() {
  if (!databaseUnavailable) {
    try {
      const overrides = await databaseModel().findMany({
        orderBy: { dexNumber: "asc" },
      });
      return {
        overrides: overrides.map(normaliseRegionalOverride).filter(Boolean),
        storage: "database",
      };
    } catch (error) {
      if (!isUnavailableDatabaseError(error)) throw error;
      databaseUnavailable = true;
      console.warn(
        "Pokémon regional database storage is unavailable; using the JSON fallback",
        error
      );
    }
  }

  return { overrides: await readFileOverrides(), storage: "file" };
}

async function savePokemonRegionalOverride(input) {
  const dexNumber = normaliseDexNumber(input?.dexNumber);
  if (dexNumber === null || typeof input?.isRegional !== "boolean") {
    throw new Error("A valid Pokédex number and regional status are required.");
  }

  const regions = input.isRegional ? normaliseRegions(input.regions) : [];
  const note = optionalNote(input.note);

  if (!databaseUnavailable) {
    try {
      const rawOverride = await databaseModel().upsert({
        where: { dexNumber },
        create: {
          dexNumber,
          isRegional: input.isRegional,
          regions: regions.length ? JSON.stringify(regions) : null,
          note,
        },
        update: {
          isRegional: input.isRegional,
          regions: regions.length ? JSON.stringify(regions) : null,
          note,
        },
      });
      return {
        override: normaliseRegionalOverride(rawOverride),
        storage: "database",
      };
    } catch (error) {
      if (!isUnavailableDatabaseError(error)) throw error;
      databaseUnavailable = true;
      console.warn(
        "Pokémon regional database storage is unavailable; using the JSON fallback",
        error
      );
    }
  }

  const existing = await readFileOverrides();
  const previous = existing.find((override) => override.dexNumber === dexNumber);
  const now = new Date().toISOString();
  const override = {
    dexNumber,
    isRegional: input.isRegional,
    regions,
    note,
    createdAt: previous?.createdAt || now,
    updatedAt: now,
  };
  await writeFileOverrides(
    [
      ...existing.filter((item) => item.dexNumber !== dexNumber),
      override,
    ].sort((left, right) => left.dexNumber - right.dexNumber)
  );
  return { override, storage: "file" };
}

async function deletePokemonRegionalOverride(value) {
  const dexNumber = normaliseDexNumber(value);
  if (dexNumber === null) {
    throw new Error("A valid Pokédex number is required.");
  }

  if (!databaseUnavailable) {
    try {
      const result = await databaseModel().deleteMany({ where: { dexNumber } });
      return { deleted: result.count > 0, storage: "database" };
    } catch (error) {
      if (!isUnavailableDatabaseError(error)) throw error;
      databaseUnavailable = true;
      console.warn(
        "Pokémon regional database storage is unavailable; using the JSON fallback",
        error
      );
    }
  }

  const existing = await readFileOverrides();
  const remaining = existing.filter((override) => override.dexNumber !== dexNumber);
  if (remaining.length === existing.length) {
    return { deleted: false, storage: "file" };
  }
  await writeFileOverrides(remaining);
  return { deleted: true, storage: "file" };
}

module.exports = {
  deletePokemonRegionalOverride,
  normaliseRegionalOverride,
  normaliseRegions,
  readPokemonRegionalOverrides,
  savePokemonRegionalOverride,
};
''')

          Path("pages/api/admin/pokemon-regional-overrides.js").write_text(r'''import { getServerSession } from "next-auth/next"
import { authOptions } from "../auth/[...nextauth]"

const {
  deletePokemonRegionalOverride,
  readPokemonRegionalOverrides,
  savePokemonRegionalOverride,
} = require("../../../lib/pokemonRegionalStore")

async function requireAdmin(req, res) {
  const session = await getServerSession(req, res, authOptions)
  return session?.user?.role === "admin"
}

export default async function handler(req, res) {
  res.setHeader("Cache-Control", "private, no-store, no-cache, must-revalidate")
  res.setHeader("CDN-Cache-Control", "no-store")
  res.setHeader("Pragma", "no-cache")
  res.setHeader("Expires", "0")

  if (!(await requireAdmin(req, res))) {
    res.status(403).json({ error: "Access denied" })
    return
  }

  try {
    if (req.method === "GET") {
      res.status(200).json(await readPokemonRegionalOverrides())
      return
    }

    if (req.method === "PUT") {
      const result = await savePokemonRegionalOverride(req.body)
      res.status(200).json({
        ...result,
        message: `Pokémon regional status saved to ${result.storage} storage.`,
      })
      return
    }

    if (req.method === "DELETE") {
      const result = await deletePokemonRegionalOverride(req.query.dexNumber)
      if (!result.deleted) {
        res.status(404).json({ error: "Pokémon regional status not found." })
        return
      }
      res.status(200).json({
        ...result,
        message: `Pokémon regional status reset in ${result.storage} storage.`,
      })
      return
    }

    res.setHeader("Allow", ["GET", "PUT", "DELETE"])
    res.status(405).json({ error: "Method not allowed" })
  } catch (error) {
    console.error("Pokémon regional status request failed", error)
    res.status(500).json({
      error:
        error instanceof Error
          ? error.message
          : "The Pokémon regional status could not be saved.",
    })
  }
}
''')

          Path("components/admin/PokemonRegionalAdmin.js").write_text(r'''import { useEffect, useMemo, useState } from "react"

const REGIONAL_AREAS = [
  "Europe",
  "Asia",
  "Africa",
  "North America",
  "South America",
  "Central America & Caribbean",
  "Oceania",
  "Middle East",
  "Northern Hemisphere",
  "Southern Hemisphere",
  "Eastern Hemisphere",
  "Western Hemisphere",
  "Polar regions",
  "Multiple regions / varies by form",
]

function splitCustomLocations(value) {
  return String(value || "")
    .split(",")
    .map((item) => item.trim())
    .filter(Boolean)
}

function draftFromOverride(override) {
  const regions = Array.isArray(override?.regions) ? override.regions : []
  const known = regions.filter((region) => REGIONAL_AREAS.includes(region))
  const custom = regions.filter((region) => !REGIONAL_AREAS.includes(region))
  return {
    isRegional: Boolean(override?.isRegional),
    regions: known,
    customLocations: custom.join(", "),
    note: override?.note || "",
  }
}

export default function PokemonRegionalAdmin({ catalog }) {
  const [overrides, setOverrides] = useState([])
  const [drafts, setDrafts] = useState({})
  const [query, setQuery] = useState("")
  const [sort, setSort] = useState("regional")
  const [onlyRegional, setOnlyRegional] = useState(false)
  const [loading, setLoading] = useState(true)
  const [savingDex, setSavingDex] = useState(null)
  const [message, setMessage] = useState("")

  useEffect(() => {
    const loadRegionalData = async () => {
      setLoading(true)
      try {
        const response = await fetch(
          `/api/admin/pokemon-regional-overrides?request=${Date.now()}`,
          { cache: "no-store", headers: { "Cache-Control": "no-cache" } }
        )
        const data = await response.json()
        if (!response.ok) {
          throw new Error(data.error || "Unable to load regional status")
        }
        const values = data.overrides || []
        setOverrides(values)
        setDrafts(
          Object.fromEntries(
            values.map((override) => [
              override.dexNumber,
              draftFromOverride(override),
            ])
          )
        )
      } catch (error) {
        setMessage(error.message)
      } finally {
        setLoading(false)
      }
    }

    loadRegionalData()
  }, [])

  const rows = useMemo(() => {
    const overrideMap = new Map(
      overrides.map((override) => [Number(override.dexNumber), override])
    )
    const normalisedQuery = query.trim().toLowerCase()
    const values = (catalog?.regions || []).flatMap((region) =>
      region.pokemon.map((pokemon) => {
        const override = overrideMap.get(Number(pokemon.dexNumber)) || null
        return {
          ...pokemon,
          generationRegion: region.region,
          override,
          isRegional: Boolean(override?.isRegional),
          regionalLocations: override?.regions || [],
        }
      })
    )

    const filtered = values.filter((row) => {
      if (onlyRegional && !row.isRegional) return false
      if (!normalisedQuery) return true
      return (
        row.name.toLowerCase().includes(normalisedQuery) ||
        String(row.dexNumber).includes(normalisedQuery) ||
        row.generationRegion.toLowerCase().includes(normalisedQuery) ||
        row.regionalLocations.join(" ").toLowerCase().includes(normalisedQuery)
      )
    })

    return filtered.sort((left, right) => {
      if (sort === "regional" && left.isRegional !== right.isRegional) {
        return left.isRegional ? -1 : 1
      }
      if (sort === "name") return left.name.localeCompare(right.name)
      return Number(left.dexNumber) - Number(right.dexNumber)
    })
  }, [catalog, overrides, query, sort, onlyRegional])

  const regionalCount = rows.filter((row) => row.isRegional).length

  const draftFor = (row) =>
    drafts[row.dexNumber] || draftFromOverride(row.override)

  const updateDraft = (dexNumber, changes) => {
    setDrafts((current) => ({
      ...current,
      [dexNumber]: { ...(current[dexNumber] || {}), ...changes },
    }))
  }

  const saveRegionalStatus = async (row) => {
    const draft = draftFor(row)
    setSavingDex(row.dexNumber)
    setMessage("")
    try {
      if (!draft.isRegional) {
        const response = await fetch(
          `/api/admin/pokemon-regional-overrides?dexNumber=${row.dexNumber}`,
          { method: "DELETE" }
        )
        if (!response.ok && response.status !== 404) {
          const data = await response.json()
          throw new Error(data.error || "Unable to clear regional status")
        }
        setOverrides((current) =>
          current.filter((override) => override.dexNumber !== row.dexNumber)
        )
        setDrafts((current) => ({
          ...current,
          [row.dexNumber]: draftFromOverride(null),
        }))
        setMessage(`${row.name} marked as not regional.`)
        return
      }

      const regions = [
        ...(draft.regions || []),
        ...splitCustomLocations(draft.customLocations),
      ]
      const response = await fetch("/api/admin/pokemon-regional-overrides", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          dexNumber: row.dexNumber,
          isRegional: true,
          regions,
          note: draft.note || null,
        }),
      })
      const data = await response.json()
      if (!response.ok) {
        throw new Error(data.error || "Unable to save regional status")
      }

      setOverrides((current) => [
        ...current.filter((override) => override.dexNumber !== row.dexNumber),
        data.override,
      ])
      setDrafts((current) => ({
        ...current,
        [row.dexNumber]: draftFromOverride(data.override),
      }))
      setMessage(
        `${row.name} marked regional${
          data.override.regions?.length
            ? `: ${data.override.regions.join(", ")}`
            : "."
        }`
      )
    } catch (error) {
      setMessage(error.message)
    } finally {
      setSavingDex(null)
    }
  }

  return (
    <section className="card admin-regional-section">
      <div className="admin-regional-heading">
        <div>
          <h2>Regional Pokémon</h2>
          <p className="muted">
            Mark species that are normally location locked. Select several broad
            areas where needed, and use custom locations for country-specific locks.
          </p>
        </div>
        {message && <p className="status-text">{message}</p>}
      </div>

      <div className="admin-regional-controls">
        <label>
          Search
          <input
            type="search"
            value={query}
            onChange={(event) => setQuery(event.target.value)}
            placeholder="Name, number or lock area"
          />
        </label>
        <label>
          Sort
          <select value={sort} onChange={(event) => setSort(event.target.value)}>
            <option value="regional">Regional first</option>
            <option value="dex">National Dex order</option>
            <option value="name">Name</option>
          </select>
        </label>
        <label className="admin-regional-checkbox">
          <input
            type="checkbox"
            checked={onlyRegional}
            onChange={(event) => setOnlyRegional(event.target.checked)}
          />
          Regional only
        </label>
        <p className="muted admin-regional-summary">
          Showing {rows.length} · {regionalCount} regional
        </p>
      </div>

      {loading ? (
        <p className="muted">Loading regional selections…</p>
      ) : (
        <div className="admin-regional-list">
          {rows.map((row) => {
            const draft = draftFor(row)
            return (
              <article
                className={`admin-regional-row ${draft.isRegional ? "regional" : ""}`}
                key={row.dexNumber}
              >
                <div className="admin-regional-name">
                  <strong>
                    #{String(row.dexNumber).padStart(3, "0")} {row.name}
                  </strong>
                  <small>{row.generationRegion}</small>
                  {row.isRegional && row.regionalLocations.length > 0 && (
                    <small>{row.regionalLocations.join(" · ")}</small>
                  )}
                </div>
                <label>
                  Regional status
                  <select
                    value={draft.isRegional ? "regional" : "not-regional"}
                    onChange={(event) =>
                      updateDraft(row.dexNumber, {
                        isRegional: event.target.value === "regional",
                      })
                    }
                  >
                    <option value="not-regional">Not regional</option>
                    <option value="regional">Regional</option>
                  </select>
                </label>
                <label>
                  Primary lock area(s)
                  <select
                    multiple
                    size="4"
                    disabled={!draft.isRegional}
                    value={draft.regions || []}
                    onChange={(event) =>
                      updateDraft(row.dexNumber, {
                        regions: Array.from(
                          event.target.selectedOptions,
                          (option) => option.value
                        ),
                      })
                    }
                  >
                    {REGIONAL_AREAS.map((area) => (
                      <option value={area} key={area}>{area}</option>
                    ))}
                  </select>
                </label>
                <label>
                  Custom locations
                  <input
                    type="text"
                    disabled={!draft.isRegional}
                    value={draft.customLocations || ""}
                    onChange={(event) =>
                      updateDraft(row.dexNumber, {
                        customLocations: event.target.value,
                      })
                    }
                    placeholder="e.g. United Kingdom, Ireland"
                  />
                </label>
                <label>
                  Note
                  <input
                    type="text"
                    maxLength={500}
                    disabled={!draft.isRegional}
                    value={draft.note || ""}
                    onChange={(event) =>
                      updateDraft(row.dexNumber, { note: event.target.value })
                    }
                    placeholder="Optional form or event details"
                  />
                </label>
                <button
                  type="button"
                  onClick={() => saveRegionalStatus(row)}
                  disabled={savingDex === row.dexNumber}
                >
                  {savingDex === row.dexNumber ? "Saving…" : "Save regional"}
                </button>
              </article>
            )
          })}
        </div>
      )}

      <style jsx>{`
        .admin-regional-section { margin-bottom: 14px; }
        .admin-regional-heading h2 { margin-bottom: 6px; }
        .admin-regional-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin: 14px 0; }
        .admin-regional-controls label, .admin-regional-row label { display: grid; gap: 5px; font-size: 0.8rem; font-weight: 700; }
        .admin-regional-controls input[type="search"] { min-width: 260px; }
        .admin-regional-checkbox { grid-auto-flow: column; align-items: center; }
        .admin-regional-summary { margin: 0 0 7px auto; }
        .admin-regional-list { display: grid; gap: 8px; max-height: 760px; overflow: auto; padding-right: 4px; }
        .admin-regional-row { display: grid; grid-template-columns: minmax(170px, 1fr) 145px minmax(180px, 1fr) minmax(180px, 1fr) minmax(180px, 1fr) auto; align-items: end; gap: 10px; padding: 12px; border: 1px solid #30363d; border-radius: 9px; background: #161b22; }
        .admin-regional-row.regional { border-left: 4px solid #a371f7; }
        .admin-regional-name { display: grid; gap: 3px; align-self: center; }
        .admin-regional-name small { color: #8b949e; }
        .admin-regional-row select[multiple] { min-height: 96px; }
        @media (max-width: 1050px) {
          .admin-regional-row { grid-template-columns: 1fr 1fr; }
          .admin-regional-row button { justify-self: start; }
          .admin-regional-summary { width: 100%; margin-left: 0; }
        }
        @media (max-width: 600px) {
          .admin-regional-controls, .admin-regional-row { display: grid; grid-template-columns: 1fr; }
          .admin-regional-controls input[type="search"] { min-width: 0; width: 100%; }
        }
      `}</style>
    </section>
  )
}
''')

