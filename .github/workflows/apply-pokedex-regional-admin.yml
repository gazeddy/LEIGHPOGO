      - name: Install dependencies
        run: npm ci

      - name: Validate and deploy migrations to temporary database
        run: |
          npx prisma validate
          npm run db:deploy

      - name: Run lint
        run: npm run lint

      - name: Run complete Jest suite
        run: npm test -- --runInBand --passWithNoTests

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Commit validated changes and remove this workflow
        run: |
          rm -f prisma/regional-validation.db regional-validation.db
          git rm .github/workflows/apply-pokedex-regional-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/pokemonRegionalStore.js \
            pages/api/admin/pokemon-regional-overrides.js \
            components/admin/PokemonRegionalAdmin.js \
            prisma/schema.prisma \
            prisma/migrations/20260803155000_add_pokemon_regional_overrides/migration.sql \
            pages/admin/pokedex.js \
            components/PokedexCatalogFetchGuard.js \
            pages/api/pokedex-catalog.js \
            pages/pokedex.js \
            __tests__/pokedex-catalog-client-cache.test.js \
            __tests__/lib/pokemonRegionalStore.test.js \
            __tests__/pokedex-regional-admin.test.js
          git commit -m "Add Pokédex regional administration"
          git push origin HEAD:develop
