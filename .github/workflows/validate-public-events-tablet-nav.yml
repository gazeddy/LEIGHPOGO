name: Validate public events and tablet navigation

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run db:deploy

      - name: Seed an empty current event cache
        run: |
          mkdir -p data
          printf '{"version":1,"fetchedAt":"%s","events":[]}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/events-cache.json
          printf '[]\n' > data/local-events.json

      - run: npm run build

      - name: Start application
        run: |
          npm run start > /tmp/leighpogo.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leighpogo.log
          exit 1

      - name: Verify public and protected routes
        run: |
          set -euo pipefail
          events_status="$(curl --silent --output /tmp/events.html --write-out '%{http_code}' http://127.0.0.1:3000/events)"
          test "$events_status" = "200"

          account_headers="$(curl --silent --head http://127.0.0.1:3000/account)"
          printf '%s\n' "$account_headers"
          printf '%s\n' "$account_headers" | grep -Eiq '^location: .*/login\?callbackUrl=%2Faccount'

      - name: Verify tablet breakpoint
        run: |
          grep -F '@media (max-width: 1050px)' styles/navbar.css
          grep -F 'max-width: 1200px' styles/navbar.css
