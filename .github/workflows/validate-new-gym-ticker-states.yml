name: Validate new gym ticker states

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

jobs:
  build-and-check:
    if: github.event.pull_request.head.ref == 'fix/new-gym-ticker-states'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-gym-ticker-states
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check ticker states and mobile treatment
        run: |
          grep -q 'type FetchState = "loading" | "ready" | "error"' components/gyms/NewGymTicker.tsx
          grep -q 'Checking for new gyms' components/gyms/NewGymTicker.tsx
          grep -q 'temporarily unavailable' components/gyms/NewGymTicker.tsx
          grep -q 'No new gyms in the last 7 days.' components/gyms/NewGymTicker.tsx
          grep -q '@media (max-width: 620px)' components/gyms/NewGymTicker.tsx
