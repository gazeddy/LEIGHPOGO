name: Dependency maintenance

on:
  push:
    branches:
      - v3
    paths:
      - .github/workflows/dependency-maintenance.yml

permissions:
  contents: write

jobs:
  audit-update-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dependency-maintenance.db
      NEXTAUTH_SECRET: dependency-maintenance-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out v3
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch vulnerable brace-expansion override
        run: npm pkg set overrides.brace-expansion=5.0.9

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Update packages within declared semver ranges
        run: npm update

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Commit and preserve concurrent v3 changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update dependencies and security fixes"
          git fetch origin v3
          if ! git diff --quiet "$GITHUB_SHA"..origin/v3 -- package.json package-lock.json; then
            echo "package.json or package-lock.json changed remotely during this run; refusing to overwrite it."
            exit 1
          fi
          git rebase origin/v3
          npm audit --audit-level=high
          npm test -- --runInBand --passWithNoTests
          npm run build
          git push origin HEAD:v3
