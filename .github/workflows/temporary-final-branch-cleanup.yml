name: Temporary final branch cleanup

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/temporary-final-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const keep = new Set(["main", "develop"]);
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "leighpogo-final-branch-cleanup",
          };

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            if (!response.ok) {
              throw new Error(`${response.status}: ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          async function main() {
            const branches = await request(
              `https://api.github.com/repos/${process.env.REPOSITORY}/branches?per_page=100`,
            );
            for (const { name } of branches) {
              if (keep.has(name)) continue;
              await request(
                `https://api.github.com/repos/${process.env.REPOSITORY}/git/refs/heads/${encodeURIComponent(name)}`,
                { method: "DELETE" },
              );
              console.log(`Deleted ${name}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
