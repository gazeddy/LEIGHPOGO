name: Security dependency refresh

on:
  push:
    branches:
      - feature/security-dependency-refresh
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret
    steps:
      - name: Check out security branch
        uses: actions/checkout@v6
        with:
          ref: feature/security-dependency-refresh

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Pin patched application dependencies
        run: |
          npm pkg set 'dependencies.next=^15.5.22'
          npm pkg set 'dependencies.next-auth=^4.24.15'
          npm pkg set 'overrides.postcss=8.5.23'
          npm pkg set 'overrides.sharp=0.35.3'
          npm install --package-lock-only --ignore-scripts

      - name: Apply remaining non-breaking npm fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install refreshed dependency tree
        run: npm ci

      - name: Check production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production application
        run: npm run build

      - name: Commit refreshed dependencies
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh vulnerable npm dependencies [skip ci]"
          git push
