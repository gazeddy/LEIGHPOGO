name: Development tooling refresh

on:
  push:
    branches:
      - feature/dev-tooling-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret
    steps:
      - name: Check out tooling branch
        uses: actions/checkout@v6
        with:
          ref: feature/dev-tooling-refresh

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Upgrade development toolchain
        run: |
          npm install --save-dev --package-lock-only --ignore-scripts \
            eslint@9 \
            eslint-config-next@15.5.22 \
            jest@30 \
            @types/node@24
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install refreshed dependency tree
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production application
        run: npm run build

      - name: Commit refreshed tooling
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No tooling changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh development tooling [skip ci]"
          git push
