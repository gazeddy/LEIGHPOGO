name: Export source

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: leighpogo-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
