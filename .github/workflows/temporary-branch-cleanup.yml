name: Temporary branch cleanup

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  delete-old-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const keep = new Set(["main", "develop"]);
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "leighpogo-branch-cleanup",
          };

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });

            if (!response.ok) {
              const body = await response.text();
              throw new Error(`${response.status} ${response.statusText}: ${body}`);
            }

            return response.status === 204 ? null : response.json();
          }

          async function main() {
            const branches = [];

            for (let page = 1; ; page += 1) {
              const batch = await request(
                `https://api.github.com/repos/${repository}/branches?per_page=100&page=${page}`,
              );

              branches.push(...batch.map((branch) => branch.name));

              if (batch.length < 100) {
                break;
              }
            }

            const deleted = [];
            const failed = [];

            for (const branch of branches) {
              if (keep.has(branch)) {
                continue;
              }

              try {
                await request(
                  `https://api.github.com/repos/${repository}/git/refs/heads/${encodeURIComponent(branch)}`,
                  { method: "DELETE" },
                );
                deleted.push(branch);
                console.log(`Deleted ${branch}`);
              } catch (error) {
                failed.push(`${branch}: ${error.message}`);
                console.error(`Failed to delete ${branch}:`, error.message);
              }
            }

            const summary = [
              "## Branch cleanup",
              "",
              `Deleted **${deleted.length}** branches.`,
              `Kept: ${[...keep].join(", ")}.`,
            ];

            if (failed.length > 0) {
              summary.push("", "### Failed deletions", ...failed.map((item) => `- ${item}`));
              process.exitCode = 1;
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join("\n")}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
