name: Validate published guide editor

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-check:
    if: startsWith(github.head_ref, 'fix/published-guide-editor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate published guide editing
        run: |
          test -f pages/admin/guide-editor.tsx
          grep -q 'loadedQuerySlugRef.current === requestedSlug' pages/admin/guide-editor.tsx
          grep -q '\[router.isReady, router.query.slug\]' pages/admin/guide-editor.tsx
          ! grep -q '\[router.isReady, router.query.slug, selectedSlug\]' pages/admin/guide-editor.tsx
          grep -q 'pathname: "/admin/guide-editor"' 'pages/guides/[slug].tsx'
          grep -q 'Edit this guide' 'pages/guides/[slug].tsx'
          grep -q 'destination: `/admin/guide-editor' pages/admin/guide-images.tsx
          grep -q 'href="/admin/guide-editor"' components/Navbar.js
          grep -q 'method: "PATCH"' pages/admin/guide-editor.tsx
          grep -q 'Save published guide' pages/admin/guide-editor.tsx
