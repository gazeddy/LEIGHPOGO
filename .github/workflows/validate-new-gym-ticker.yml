name: Validate new gym ticker fix

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

jobs:
  build-and-check:
    if: github.event.pull_request.head.ref == 'fix/show-empty-new-gym-ticker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/show-empty-new-gym-ticker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check authenticated empty ticker state
        run: |
          grep -q 'if (status !== "authenticated")' components/gyms/NewGymTicker.tsx
          grep -q 'No newly added gyms in the last 7 days.' components/gyms/NewGymTicker.tsx
          ! grep -q 'status !== "authenticated" || gyms.length === 0' components/gyms/NewGymTicker.tsx
