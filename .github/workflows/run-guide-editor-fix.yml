name: Run guide editor fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/published-guide-editor

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guide editor transformation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-published-guide-editor.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])
          Path('/tmp/apply-guide-editor-fix.py').write_text(script + '\n')
          PY
          python /tmp/apply-guide-editor-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate published guide editing
        run: |
          test -f pages/admin/guide-editor.tsx
          grep -q 'pathname: "/admin/guide-editor"' 'pages/guides/[slug].tsx'
          grep -q 'Edit this guide' 'pages/guides/[slug].tsx'
          grep -q 'router.query.slug' pages/admin/guide-editor.tsx
          grep -q 'destination: `/admin/guide-editor' pages/admin/guide-images.tsx
          grep -q 'href="/admin/guide-editor"' components/Navbar.js
          grep -q 'method: "PATCH"' pages/admin/guide-editor.tsx
          grep -q 'Save published guide' pages/admin/guide-editor.tsx

      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Navbar.js pages/admin pages/guides/'[slug].tsx'
          git commit -m "Fix published guide editor access"
          git push origin HEAD:fix/published-guide-editor
