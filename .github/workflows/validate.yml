name: Validate

on:
  pull_request:
    branches:
      - main
      - v3
  push:
    branches:
      - main
      - v3

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate migration scripts
        run: |
          python3 -m py_compile scripts/merge-dev-data.py
          python3 -m py_compile scripts/merge-v3-cutover-state.py
          python3 -m py_compile scripts/test-v3-cutover-merge.py
          python3 scripts/merge-dev-data.py --help >/dev/null
          python3 scripts/merge-v3-cutover-state.py --help >/dev/null
          python3 scripts/test-v3-cutover-merge.py
          bash -n deploy/migrate-v2-to-live.sh
          bash -n deploy/promote-v3-to-live.sh

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production
