name: Cleanup v3 temp branches

on:
  push:
    branches:
      - v3
    paths:
      - .github/workflows/cleanup-v3-temp-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3
        uses: actions/checkout@v6
        with:
          ref: v3

      - name: Delete temporary branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            v3-raid-implementation-tmp \
            v3-raid-implementation-tmp2 \
            v3-raid-implementation-tmp3 \
            v3-raid-implementation-tmp4 \
            v3-raid-implementation-tmp5
          do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v3-temp-branches.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:v3
