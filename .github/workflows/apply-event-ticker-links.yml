name: Apply event ticker links

on:
  push:
    branches: [feature/event-ticker-links]
    paths:
      - .github/workflows/apply-event-ticker-links.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-ticker-links

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Link ticker entries to event cards
        run: |
          python - <<'PY'
          from pathlib import Path

          ticker_path = Path("components/events/EventTicker.tsx")
          ticker = ticker_path.read_text()

          old_ticker_item = '''          <span key={key} className="ticker-item">
            <span className="ticker-heading">{item.heading}</span>
            <span className="ticker-name">{item.name}</span>
            <time dateTime={item.start}>{formatTickerDate(item.start)}</time>
'''
          new_ticker_item = '''          <span key={key} className="ticker-item">
            <Link
              href={{ pathname: "/events", query: { event: item.eventID } }}
              className="ticker-event-link"
              tabIndex={duplicate ? -1 : undefined}
              title={`View ${item.name} on the Events page`}
            >
              <span className="ticker-heading">{item.heading}</span>
              <span className="ticker-name">{item.name}</span>
              <time dateTime={item.start}>{formatTickerDate(item.start)}</time>
            </Link>
'''
          if old_ticker_item not in ticker:
              raise SystemExit("Ticker item block was not found")
          ticker = ticker.replace(old_ticker_item, new_ticker_item, 1)

          old_ticker_css = '''        .ticker-heading {
          color: #79c0ff;
'''
          new_ticker_css = '''        .ticker-event-link {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          border-radius: 4px;
          padding: 0 4px;
          color: inherit;
          line-height: 26px;
          text-decoration: none;
        }

        .ticker-event-link:hover,
        .ticker-event-link:focus-visible {
          background: #1f2937;
          outline: none;
        }

        .ticker-event-link:hover .ticker-name,
        .ticker-event-link:focus-visible .ticker-name {
          text-decoration: underline;
        }

        .ticker-heading {
          color: #79c0ff;
'''
          if old_ticker_css not in ticker:
              raise SystemExit("Ticker CSS insertion point was not found")
          ticker = ticker.replace(old_ticker_css, new_ticker_css, 1)
          ticker_path.write_text(ticker)

          events_path = Path("pages/events/index.tsx")
          events = events_path.read_text()

          events = events.replace(
              'import Head from "next/head";\n',
              'import Head from "next/head";\nimport { useRouter } from "next/router";\n',
              1,
          )
          events = events.replace(
              'import { useMemo, useState } from "react";',
              'import { useEffect, useMemo, useState } from "react";',
              1,
          )

          function_anchor = '''function formatFetchedAt(value: string | null): string | null {
'''
          if function_anchor not in events:
              raise SystemExit("Events helper insertion point was not found")

          helper = '''function eventTargetId(eventID: string): string {
  return `event-${encodeURIComponent(eventID)}`;
}

'''
          events = events.replace(function_anchor, helper + function_anchor, 1)

          session_anchor = '''  const { data: session } = useSession();
  const [selectedType, setSelectedType] = useState("all");
'''
          session_replacement = '''  const router = useRouter();
  const { data: session } = useSession();
  const [selectedType, setSelectedType] = useState("all");
'''
          if session_anchor not in events:
              raise SystemExit("Events component state insertion point was not found")
          events = events.replace(session_anchor, session_replacement, 1)

          formatted_anchor = '''  const formattedFetchedAt = formatFetchedAt(fetchedAt);

'''
          formatted_replacement = '''  const formattedFetchedAt = formatFetchedAt(fetchedAt);
  const selectedEventID =
    router.isReady && typeof router.query.event === "string"
      ? router.query.event
      : null;

'''
          if formatted_anchor not in events:
              raise SystemExit("Selected event insertion point was not found")
          events = events.replace(formatted_anchor, formatted_replacement, 1)

          visible_anchor = '''  const visibleEvents = useMemo(
    () =>
      selectedType === "all"
        ? events
        : events.filter((event) => event.eventType === selectedType),
    [events, selectedType],
  );

'''
          visible_replacement = visible_anchor + '''  useEffect(() => {
    if (!selectedEventID) {
      return;
    }

    setSelectedType("all");
    const scrollTimer = window.setTimeout(() => {
      const target = document.getElementById(eventTargetId(selectedEventID));

      if (!target) {
        return;
      }

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      target.scrollIntoView({
        behavior: reduceMotion ? "auto" : "smooth",
        block: "center",
      });
      target.focus({ preventScroll: true });
    }, 0);

    return () => window.clearTimeout(scrollTimer);
  }, [selectedEventID, visibleEvents]);

'''
          if visible_anchor not in events:
              raise SystemExit("Visible events block was not found")
          events = events.replace(visible_anchor, visible_replacement, 1)

          old_cards = '''            {visibleEvents.map((event) => (
              <EventCard key={event.eventID} event={event} />
            ))}
'''
          new_cards = '''            {visibleEvents.map((event) => {
              const isSelected = event.eventID === selectedEventID;

              return (
                <div
                  key={event.eventID}
                  id={eventTargetId(event.eventID)}
                  className={`event-target${isSelected ? " selected" : ""}`}
                  tabIndex={-1}
                >
                  <EventCard event={event} />
                </div>
              );
            })}
'''
          if old_cards not in events:
              raise SystemExit("Events card map was not found")
          events = events.replace(old_cards, new_cards, 1)

          old_grid_css = '''        .events-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 16px;
        }

'''
          new_grid_css = old_grid_css + '''        .event-target {
          min-width: 0;
          border-radius: 12px;
          scroll-margin-top: 160px;
          outline: 3px solid transparent;
          transition:
            outline-color 0.2s ease,
            box-shadow 0.2s ease;
        }

        .event-target:focus {
          outline-color: transparent;
        }

        .event-target.selected {
          outline-color: #58a6ff;
          box-shadow: 0 0 0 5px rgba(88, 166, 255, 0.2);
        }

'''
          if old_grid_css not in events:
              raise SystemExit("Events grid CSS insertion point was not found")
          events = events.replace(old_grid_css, new_grid_css, 1)
          events_path.write_text(events)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate event selection links
        run: |
          grep -q 'pathname: "/events", query: { event: item.eventID }' components/events/EventTicker.tsx
          grep -q 'className="ticker-event-link"' components/events/EventTicker.tsx
          grep -q 'function eventTargetId' pages/events/index.tsx
          grep -q 'target.scrollIntoView' pages/events/index.tsx
          grep -q 'setSelectedType("all")' pages/events/index.tsx
          grep -q 'className={`event-target${isSelected ? " selected" : ""}`}' pages/events/index.tsx

      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/events/EventTicker.tsx pages/events/index.tsx
          git commit -m "Link event ticker to selected event"
          git push origin HEAD:feature/event-ticker-links
