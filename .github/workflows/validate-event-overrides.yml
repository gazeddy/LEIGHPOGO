name: Validate event feed overrides

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run db:deploy

      - name: Seed feed and overrides
        run: |
          mkdir -p data
          cat > data/events-cache.json <<'JSON'
          {
            "version": 1,
            "fetchedAt": "2026-07-30T12:00:00.000Z",
            "events": [
              {
                "eventID": "community-day-test",
                "name": "Original Community Day",
                "eventType": "community-day",
                "heading": "Community Day",
                "link": "https://leekduck.com/events/original-community-day/",
                "image": null,
                "start": "2026-08-08T14:00:00+01:00",
                "end": "2026-08-08T17:00:00+01:00",
                "tags": ["community-day"]
              },
              {
                "eventID": "hidden-now-test",
                "name": "Hidden immediately",
                "eventType": "community-day",
                "heading": "Community Day",
                "link": "https://leekduck.com/events/hidden-now/",
                "image": null,
                "start": "2026-08-09T14:00:00+01:00",
                "end": "2026-08-09T17:00:00+01:00"
              },
              {
                "eventID": "scheduled-past-test",
                "name": "Scheduled past hide",
                "eventType": "raid-hour",
                "heading": "Raid Hour",
                "link": "https://leekduck.com/events/scheduled-past/",
                "image": null,
                "start": "2026-08-10T18:00:00+01:00",
                "end": "2026-08-10T19:00:00+01:00"
              },
              {
                "eventID": "scheduled-future-test",
                "name": "Future scheduled event",
                "eventType": "raid-hour",
                "heading": "Raid Hour",
                "link": "https://leekduck.com/events/scheduled-future/",
                "image": null,
                "start": "2026-08-11T18:00:00+01:00",
                "end": "2026-08-11T19:00:00+01:00"
              }
            ]
          }
          JSON

          cat > data/event-overrides.json <<'JSON'
          [
            {
              "eventID": "community-day-test",
              "name": "Leigh Community Day Meetup",
              "heading": "Leigh Community Day",
              "description": "Join the Leigh group on Campfire.",
              "campfireUrl": "https://campfire.nianticlabs.com/discover/leigh-test",
              "image": null,
              "tags": ["community-day", "meetup"],
              "hidden": false,
              "hideAt": "2099-01-01T00:00:00.000Z",
              "updatedAt": "2026-07-30T12:00:00.000Z"
            },
            {
              "eventID": "hidden-now-test",
              "name": "Hidden immediately",
              "heading": "Community Day",
              "description": null,
              "campfireUrl": null,
              "image": null,
              "tags": [],
              "hidden": true,
              "hideAt": null,
              "updatedAt": "2026-07-30T12:00:00.000Z"
            },
            {
              "eventID": "scheduled-past-test",
              "name": "Scheduled past hide",
              "heading": "Raid Hour",
              "description": null,
              "campfireUrl": null,
              "image": null,
              "tags": [],
              "hidden": false,
              "hideAt": "2020-01-01T00:00:00.000Z",
              "updatedAt": "2026-07-30T12:00:00.000Z"
            },
            {
              "eventID": "scheduled-future-test",
              "name": "Future scheduled event",
              "heading": "Raid Hour",
              "description": null,
              "campfireUrl": null,
              "image": null,
              "tags": [],
              "hidden": false,
              "hideAt": "2099-01-01T00:00:00.000Z",
              "updatedAt": "2026-07-30T12:00:00.000Z"
            }
          ]
          JSON

          printf '[]\n' > data/local-events.json

      - run: npm run build

      - name: Start application
        run: |
          npm run start > /tmp/leighpogo.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/events > /tmp/events.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leighpogo.log
          exit 1

      - name: Verify override and hide behaviour
        run: |
          set -euo pipefail
          grep -F 'Leigh Community Day Meetup' /tmp/events.html
          grep -F 'https://campfire.nianticlabs.com/discover/leigh-test' /tmp/events.html
          grep -F 'Future scheduled event' /tmp/events.html
          ! grep -F 'Original Community Day' /tmp/events.html
          ! grep -F 'Hidden immediately' /tmp/events.html
          ! grep -F 'Scheduled past hide' /tmp/events.html

      - name: Verify admin editor builds
        run: |
          test -f .next/server/pages/admin/events.html || test -f .next/server/pages/admin/events.js
          grep -F 'Automatically hide from' pages/admin/events.tsx
