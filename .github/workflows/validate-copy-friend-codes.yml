name: Validate friend code copy

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build

      - name: Verify persistent copy controls
        run: |
          set -euo pipefail
          grep -F 'navigator.clipboard?.writeText' pages/index.js
          grep -F 'setCopiedEntryId(entry.id)' pages/index.js
          grep -F '{copied ? "Copied" : "Copy"}' pages/index.js
          grep -F 'replace(/\D/g, "")' pages/index.js
          ! grep -F 'setTimeout' pages/index.js
