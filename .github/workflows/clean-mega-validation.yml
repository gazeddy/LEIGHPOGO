name: Clean Mega validation output

on:
  push:
    branches:
      - agent/add-mega-evolution-costs

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated validation files
        shell: bash
        run: |
          git fetch origin develop
          git checkout origin/develop -- .next next-env.d.ts
          git rm -f --ignore-unmatch prisma/validation.db
          rm -f .github/workflows/clean-mega-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove generated Mega validation files"
          git push origin HEAD:agent/add-mega-evolution-costs
