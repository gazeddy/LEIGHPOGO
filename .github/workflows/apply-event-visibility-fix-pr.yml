name: Apply event visibility fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/global-event-hiding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply patch
        run: |
          python scripts/apply-event-visibility-fix-v4.py
          rm -f scripts/apply-event-visibility-fix.py
          rm -f scripts/apply-event-visibility-fix-v4.py
          rm -f .event-visibility-trigger
          rm -f .github/workflows/apply-event-visibility-fix.yml
          rm -f .github/workflows/apply-event-visibility-fix-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make event hiding global and refresh tickers"
          git push origin HEAD:${{ github.head_ref }}
