name: Apply event visibility fix on PR

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/global-event-hiding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run patch
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-event-visibility-fix.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY"
          patch = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in patch.splitlines()]
          Path('/tmp/apply-event-visibility-fix.py').write_text('\n'.join(lines) + '\n')
          PY

          python /tmp/apply-event-visibility-fix.py
          rm -f .github/workflows/apply-event-visibility-fix-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make event hiding global and refresh tickers"
          git push origin HEAD:${{ github.head_ref }}
