name: Fix Ditto ticker scrolling

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-ditto-ticker-scroll.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fix short ticker looping
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          hook_path = Path("components/tickers/useScrollableTicker.ts")
          hook = hook_path.read_text(encoding="utf-8")

          old_ref = "  const copyWidthRef = useRef(0);\n"
          new_ref = (
              "  const copyWidthRef = useRef(0);\n"
              "  const copyCountRef = useRef(0);\n"
              "  const scrollableRef = useRef(false);\n"
          )
          if hook.count(old_ref) != 1:
              raise RuntimeError("copyWidthRef marker not found exactly once")
          hook = hook.replace(old_ref, new_ref, 1)

          normalise = '''  const normaliseScrollPosition = useCallback(() => {
            const viewport = viewportRef.current;
            const track = viewport?.firstElementChild as HTMLElement | null;
            const copyWidth = copyWidthRef.current;
            const copyCount = copyCountRef.current;

            if (!viewport || !track || copyWidth <= 0 || copyCount < 3) {
              return;
            }

            const maxScrollLeft = Math.max(
              0,
              track.scrollWidth - viewport.clientWidth,
            );
            if (maxScrollLeft <= 0) {
              return;
            }

            const middleCopyIndex = Math.floor(copyCount / 2);
            const centreScrollLeft = Math.min(
              copyWidth * middleCopyIndex,
              maxScrollLeft,
            );
            const lowerBoundary = Math.max(0, centreScrollLeft - copyWidth);
            const upperBoundary = Math.min(
              maxScrollLeft,
              centreScrollLeft + copyWidth,
            );

            if (
              viewport.scrollLeft <= lowerBoundary &&
              viewport.scrollLeft + copyWidth <= maxScrollLeft
            ) {
              viewport.scrollLeft += copyWidth;
            } else if (
              viewport.scrollLeft >= upperBoundary &&
              viewport.scrollLeft - copyWidth >= 0
            ) {
              viewport.scrollLeft -= copyWidth;
            }
          }, []);'''
          hook, count = re.subn(
              r"  const normaliseScrollPosition = useCallback\(\(\) => \{.*?\n  \}, \[\]\);",
              normalise,
              hook,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("normaliseScrollPosition block not replaced")

          measure = '''    const measure = () => {
              const track = viewport.firstElementChild as HTMLElement | null;
              const firstCopy = track?.firstElementChild as HTMLElement | null;
              const copyWidth = firstCopy?.getBoundingClientRect().width ?? 0;
              const copyCount = track?.childElementCount ?? 0;
              const maxScrollLeft = Math.max(
                0,
                (track?.scrollWidth ?? 0) - viewport.clientWidth,
              );

              copyWidthRef.current = copyWidth;
              copyCountRef.current = copyCount;
              scrollableRef.current = copyWidth > 0 && maxScrollLeft > 0;

              if (scrollableRef.current) {
                const middleCopyIndex = Math.floor(copyCount / 2);
                const initialScrollLeft = Math.min(
                  copyWidth * middleCopyIndex,
                  maxScrollLeft,
                );

                if (!initialised || viewport.scrollLeft <= 0) {
                  viewport.scrollLeft = initialScrollLeft;
                }
              } else {
                viewport.scrollLeft = 0;
              }

              initialised = true;
            };'''
          hook, count = re.subn(
              r"    const measure = \(\) => \{.*?\n    \};",
              measure,
              hook,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("measure block not replaced")

          if hook.count("copyWidth > viewport.clientWidth &&") != 1:
              raise RuntimeError("animation width condition not found exactly once")
          hook = hook.replace(
              "copyWidth > viewport.clientWidth &&",
              "scrollableRef.current &&",
              1,
          )

          hook, count = re.subn(
              r"if \(\s*!viewport \|\|\s*copyWidthRef\.current <= viewport\.clientWidth\s*\) \{",
              "if (!viewport || !scrollableRef.current) {",
              hook,
              count=1,
          )
          if count != 1:
              raise RuntimeError("pointer width condition not replaced")

          hook_path.write_text(hook, encoding="utf-8")

          ditto_path = Path("components/events/DittoDisguiseTicker.tsx")
          ditto = ditto_path.read_text(encoding="utf-8")
          repeated_items = '''<div className="ditto-track">
                <DittoItems disguises={disguises} duplicate />
                <DittoItems disguises={disguises} duplicate />
                <DittoItems disguises={disguises} duplicate />
                <DittoItems disguises={disguises} />
                <DittoItems disguises={disguises} duplicate />
                <DittoItems disguises={disguises} duplicate />
                <DittoItems disguises={disguises} duplicate />
              </div>'''
          ditto, count = re.subn(
              r'<div className="ditto-track">\s*(?:<DittoItems[^>]+/>\s*){3}</div>',
              repeated_items,
              ditto,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Ditto repeated track not replaced")
          ditto_path.write_text(ditto, encoding="utf-8")

          test_path = Path("__tests__/components/tickers.test.js")
          tests = test_path.read_text(encoding="utf-8")
          tests, count = re.subn(
              r'(dittoTicker\.match\(/<DittoItems disguises=\\\{disguises\\\} duplicate \\/>/g\) \|\| \[\]\)\.length,\s*\)\.toBe\()2(\);)',
              r'\g<1>6\g<2>',
              tests,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Ditto duplicate test count not replaced")

          assertion = '    expect(scrollableTicker).toContain("scrollableRef.current");\n'
          marker = '    expect(scrollableTicker).toContain("normaliseScrollPosition");\n'
          if assertion not in tests:
              if marker not in tests:
                  raise RuntimeError("Ticker test marker not found")
              tests = tests.replace(marker, marker + assertion, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-ditto-ticker-scroll.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tickers/useScrollableTicker.ts \
            components/events/DittoDisguiseTicker.tsx \
            __tests__/components/tickers.test.js \
            .github/workflows/fix-ditto-ticker-scroll.yml
          git commit -m "Fix Ditto ticker scrolling on wide viewports"
          git push origin develop
