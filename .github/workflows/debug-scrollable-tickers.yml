name: Debug scrollable tickers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Run the pending transformation locally
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-scrollable-tickers.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          tolerant_helpers = r'''
import re

def flexible_pattern(value):
    return ''.join(
        r'\s+' if part.isspace() else re.escape(part)
        for part in re.split(r'(\s+)', value)
        if part
    )

def replace_once(path, old, new):
    text = read(path)
    if old in text:
        write(path, text.replace(old, new, 1))
        return

    updated, count = re.subn(
        flexible_pattern(old),
        lambda _match: new,
        text,
        count=1,
        flags=re.MULTILINE,
    )
    if count != 1:
        raise RuntimeError(f"Expected text not found in {path}: {old[:120]!r}")
    write(path, updated)

def replace_between(path, start_marker, end_marker, replacement):
    text = read(path)
    start_match = re.search(flexible_pattern(start_marker), text, flags=re.MULTILINE)
    if start_match is None:
        raise RuntimeError(f"Start marker not found in {path}: {start_marker!r}")

    remaining = text[start_match.end():]
    end_match = re.search(flexible_pattern(end_marker), remaining, flags=re.MULTILINE)
    if end_match is None:
        raise RuntimeError(f"End marker not found in {path}: {end_marker!r}")

    end = start_match.end() + end_match.start()
    write(path, text[:start_match.start()] + replacement + text[end:])
'''
          script = script.replace("hook = '''import {", tolerant_helpers + "\nhook = '''import {", 1)
          Path('/tmp/apply-scrollable-tickers.py').write_text(script + '\n', encoding='utf-8')
          PY
          python /tmp/apply-scrollable-tickers.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
