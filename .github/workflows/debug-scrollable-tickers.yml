name: Debug scrollable tickers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Run the pending transformation locally
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-scrollable-tickers.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          tolerant_helpers = r'''
          import re

          def flexible_pattern(value):
              return ''.join(
                  r'\s+' if part.isspace() else re.escape(part)
                  for part in re.split(r'(\s+)', value)
                  if part
              )

          def replace_once(path, old, new):
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return

              updated, count = re.subn(
                  flexible_pattern(old),
                  lambda _match: new,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:120]!r}")
              write(path, updated)

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              start_match = re.search(flexible_pattern(start_marker), text, flags=re.MULTILINE)
              if start_match is None:
                  raise RuntimeError(f"Start marker not found in {path}: {start_marker!r}")

              remaining = text[start_match.end():]
              end_match = re.search(flexible_pattern(end_marker), remaining, flags=re.MULTILINE)
              if end_match is None:
                  raise RuntimeError(f"End marker not found in {path}: {end_marker!r}")

              end = start_match.end() + end_match.start()
              write(path, text[:start_match.start()] + replacement + text[end:])
          '''
          tolerant_helpers = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in tolerant_helpers.splitlines()
          )
          script = script.replace("hook = '''import {", tolerant_helpers + "\nhook = '''import {", 1)
          Path('/tmp/apply-scrollable-tickers.py').write_text(script + '\n', encoding='utf-8')
          PY
          python /tmp/apply-scrollable-tickers.py

      - name: Clean generated JSX overlaps
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected generated block not found in {path}: {old[:100]!r}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path, label, item_component, item_prop in (
              ('components/events/EventTicker.tsx', 'ticker', 'TickerItems', 'items'),
              ('components/events/RaidBossTicker.tsx', 'raid', 'RaidItems', 'items'),
              ('components/events/DittoDisguiseTicker.tsx', 'ditto', 'DittoItems', 'disguises'),
          ):
              component_name = {
                  'ticker': 'event-ticker',
                  'raid': 'raid-ticker',
                  'ditto': 'ditto-ticker',
              }[label]
              if label in ('ticker', 'raid'):
                  replace_required(path, 'return (    <section', 'return (\n    <section')
                  replace_required(
                      path,
                      f'    <div className="{label}-label">\n    >\n      <div className="{label}-label">',
                      f'      <div className="{label}-label">',
                  )

              condition = 'items.length' if item_prop == 'items' else 'disguises.length'
              replace_required(
                  path,
                  f'{{{condition} > 0 ? (          <div className="{label}-track">',
                  f'{{{condition} > 0 ? (\n          <div className="{label}-track">',
              )

              old_items = (
                  f'          <div className="{label}-track">\n'
                  f'          <{item_component} {item_prop}={{{item_prop}}} duplicate />\n'
                  f'          <{item_component} {item_prop}={{{item_prop}}} />\n'
                  f'          >'
              )
              start = Path(path).read_text(encoding='utf-8').find(old_items)
              if start < 0:
                  raise RuntimeError(f'Generated item block start not found in {path}')
              text = Path(path).read_text(encoding='utf-8')
              end = text.find('          </div>', start)
              if end < 0:
                  raise RuntimeError(f'Generated item block end not found in {path}')
              end += len('          </div>')
              replacement = (
                  f'          <div className="{label}-track">\n'
                  f'            <{item_component} {item_prop}={{{item_prop}}} duplicate />\n'
                  f'            <{item_component} {item_prop}={{{item_prop}}} />\n'
                  f'            <{item_component} {item_prop}={{{item_prop}}} duplicate />\n'
                  f'          </div>'
              )
              Path(path).write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          gym_path = Path('components/gyms/NewGymTicker.tsx')
          gym_text = gym_path.read_text(encoding='utf-8')
          gym_text = gym_text.replace(
              ') : (          <div className="new-gym-track">',
              ') : (\n          <div className="new-gym-track">',
              1,
          )
          duplicate_style = '''    <style jsx>{`
          >
            <div className="new-gym-copy">{items}</div>
            <div className="new-gym-copy" aria-hidden="true">{items}</div>
          </div>
        )}
      </div>

      <style jsx>{`'''
          if duplicate_style not in gym_text:
              raise RuntimeError('Generated duplicate new-gym block not found')
          gym_text = gym_text.replace(duplicate_style, '      <style jsx>{`', 1)
          gym_path.write_text(gym_text, encoding='utf-8')
          PY

      - name: Show cleaned ticker sections
        run: |
          echo '--- EventTicker 185-215 ---'
          nl -ba components/events/EventTicker.tsx | sed -n '185,215p'
          echo '--- RaidBossTicker 238-268 ---'
          nl -ba components/events/RaidBossTicker.tsx | sed -n '238,268p'
          echo '--- DittoDisguiseTicker 120-145 ---'
          nl -ba components/events/DittoDisguiseTicker.tsx | sed -n '120,145p'
          echo '--- NewGymTicker 140-175 ---'
          nl -ba components/gyms/NewGymTicker.tsx | sed -n '140,175p'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
