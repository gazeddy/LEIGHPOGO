name: Validate current develop

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./prisma/validation.db
      NEXTAUTH_SECRET: validation-secret-only
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run complete Jest suite
        run: npm test -- --runInBand

      - name: Run production build
        env:
          NODE_ENV: production
        run: npm run build
