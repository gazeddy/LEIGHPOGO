name: Fix ticker subpixel scrolling

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-ticker-subpixel-scroll.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./validation.db
      NEXTAUTH_SECRET: validation-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Preserve fractional ticker movement
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(
                      f"Expected one regex match in {path}, found {count}: {pattern[:120]!r}"
                  )
              file_path.write_text(updated, encoding="utf-8")

          hook = "components/tickers/useScrollableTicker.ts"

          sub_once(
              hook,
              r"  const scrollableRef = useRef\(false\);\n",
              "  const scrollableRef = useRef(false);\n"
              "  const virtualScrollLeftRef = useRef(0);\n",
          )

          sub_once(
              hook,
              r"    if \(!scrollable\) \{\n\s*viewport\.scrollLeft = 0;\n\s*return false;\n\s*\}",
              "    if (!scrollable) {\n"
              "      virtualScrollLeftRef.current = 0;\n"
              "      viewport.scrollLeft = 0;\n"
              "      return false;\n"
              "    }",
          )

          sub_once(
              hook,
              r"    if \(resetPosition \|\| viewport\.scrollLeft <= 0\.5\) \{.*?\n    \}\n\n    return true;",
              '''    if (resetPosition || viewport.scrollLeft <= 0.5) {
              const preferredPosition = copyWidth * Math.floor(copyCount / 2);
              const minimumSafePosition = Math.min(copyWidth, maxScrollLeft);
              const maximumSafePosition = Math.max(
                minimumSafePosition,
                maxScrollLeft - copyWidth,
              );
              const nextScrollLeft = Math.min(
                Math.max(preferredPosition, minimumSafePosition),
                maximumSafePosition,
              );

              virtualScrollLeftRef.current = nextScrollLeft;
              viewport.scrollLeft = nextScrollLeft;
            } else if (
              Math.abs(viewport.scrollLeft - virtualScrollLeftRef.current) > 1
            ) {
              virtualScrollLeftRef.current = viewport.scrollLeft;
            }

            return true;''',
              re.S,
          )

          sub_once(
              hook,
              r"  const normaliseScrollPosition = useCallback\(\(\) => \{.*?\n  \}, \[\]\);\n\n  useEffect\(\(\) => \{\n    const reducedMotion",
              '''  const normaliseScrollPosition = useCallback(() => {
            const viewport = viewportRef.current;
            const track = viewport?.firstElementChild as HTMLElement | null;
            const copyWidth = copyWidthRef.current;
            const copyCount = copyCountRef.current;

            if (!viewport || !track || copyWidth <= 0 || copyCount < 3) {
              return;
            }

            const maxScrollLeft = Math.max(
              0,
              track.scrollWidth - viewport.clientWidth,
            );
            if (maxScrollLeft <= 0) {
              return;
            }

            const edgeBuffer = Math.min(copyWidth / 2, maxScrollLeft / 4);
            let nextScrollLeft = virtualScrollLeftRef.current;

            if (
              nextScrollLeft <= edgeBuffer &&
              nextScrollLeft + copyWidth <= maxScrollLeft
            ) {
              nextScrollLeft += copyWidth;
            } else if (
              nextScrollLeft >= maxScrollLeft - edgeBuffer &&
              nextScrollLeft - copyWidth >= 0
            ) {
              nextScrollLeft -= copyWidth;
            }

            if (nextScrollLeft !== virtualScrollLeftRef.current) {
              virtualScrollLeftRef.current = nextScrollLeft;
              viewport.scrollLeft = nextScrollLeft;
            }
          }, []);

          useEffect(() => {
            const reducedMotion''',
              re.S,
          )

          sub_once(
              hook,
              r"        viewport\.scrollLeft \+= \(copyWidth / seconds\) \* elapsedSeconds;",
              "        virtualScrollLeftRef.current +=\n"
              "          (copyWidth / seconds) * elapsedSeconds;\n"
              "        viewport.scrollLeft = virtualScrollLeftRef.current;",
          )

          sub_once(
              hook,
              r"    pauseTicker\(\);\n    dragRef\.current = \{",
              "    pauseTicker();\n"
              "    virtualScrollLeftRef.current = viewport.scrollLeft;\n"
              "    dragRef.current = {",
          )

          sub_once(
              hook,
              r"    viewport\.scrollLeft = nextScrollLeft;\n  \}\n\n  function finishPointerInteraction",
              "    virtualScrollLeftRef.current = nextScrollLeft;\n"
              "    viewport.scrollLeft = nextScrollLeft;\n"
              "  }\n\n"
              "  function finishPointerInteraction",
          )

          sub_once(
              hook,
              r"  function handleWheel\(_event: WheelEvent<HTMLDivElement>\) \{.*?\n  \}",
              '''  function handleWheel(_event: WheelEvent<HTMLDivElement>) {
            pauseTicker();
            window.requestAnimationFrame(() => {
              const viewport = viewportRef.current;
              if (viewport) {
                virtualScrollLeftRef.current = viewport.scrollLeft;
              }
              normaliseScrollPosition();
            });
            scheduleResume();
          }''',
              re.S,
          )

          tests = "__tests__/components/tickers.test.js"
          sub_once(
              tests,
              r'    expect\(scrollableTicker\)\.toContain\("viewport\.scrollLeft \+="\);\n',
              '    expect(scrollableTicker).toContain("virtualScrollLeftRef.current +=");\n'
              '    expect(scrollableTicker).toContain(\n'
              '      "viewport.scrollLeft = virtualScrollLeftRef.current",\n'
              '    );\n',
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-ticker-subpixel-scroll.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tickers/useScrollableTicker.ts \
            __tests__/components/tickers.test.js \
            .github/workflows/fix-ticker-subpixel-scroll.yml
          git commit -m "Preserve subpixel ticker auto-scroll movement"
          git push origin develop
