name: Apply global event visibility fix

on:
  push:
    branches: [fix/global-event-hiding]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Make event hiding global and refresh tickers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-event-hiding
          fetch-depth: 0

      - name: Patch event visibility behaviour
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          Path("lib/event-visibility-client.ts").write_text('''export const EVENT_VISIBILITY_CHANGED_EVENT =
            "leighpogo:event-visibility-changed";
          export const EVENT_VISIBILITY_POLL_INTERVAL_MS = 60_000;

          export function notifyEventVisibilityChanged(): void {
            if (typeof window !== "undefined") {
              window.dispatchEvent(new Event(EVENT_VISIBILITY_CHANGED_EVENT));
            }
          }
          ''')

          replace_once(
              "lib/event-overrides.ts",
              '''  return events.flatMap((event) => {
            const override = overrideByEventID.get(event.eventID);

            // An individual event override is an explicit exception to its type rule.
            if (override) {
              if (hideTimeReached(override.hidden, override.hideAt, now)) {
                return [];
              }

              return [
                {
                  ...event,
                  name: override.name,
                  heading: override.heading,
                  description: override.description,
                  campfireUrl: override.campfireUrl,
                  image: override.image,
                  tags: override.tags,
                  link: override.campfireUrl || event.link,
                },
              ];
            }

            const typeRule = ruleByEventType.get(normaliseEventType(event.eventType));

            if (typeRule && hideTimeReached(typeRule.hidden, typeRule.hideAt, now)) {
              return [];
            }

            return [event];
          });''',
              '''  return events.flatMap((event) => {
            const override = overrideByEventID.get(event.eventID);
            const typeRule = ruleByEventType.get(normaliseEventType(event.eventType));
            const eventIsHidden =
              (override && hideTimeReached(override.hidden, override.hideAt, now)) ||
              (typeRule && hideTimeReached(typeRule.hidden, typeRule.hideAt, now));

            if (eventIsHidden) {
              return [];
            }

            if (!override) {
              return [event];
            }

            return [
              {
                ...event,
                name: override.name,
                heading: override.heading,
                description: override.description,
                campfireUrl: override.campfireUrl,
                image: override.image,
                tags: override.tags,
                link: override.campfireUrl || event.link,
              },
            ];
          });''',
          )

          replace_once(
              "components/events/EventTicker.tsx",
              'import type { EventTickerItem } from "../../lib/events";',
              '''import type { EventTickerItem } from "../../lib/events";
          import {
            EVENT_VISIBILITY_CHANGED_EVENT,
            EVENT_VISIBILITY_POLL_INTERVAL_MS,
          } from "../../lib/event-visibility-client";''',
          )

          replace_once(
              "components/events/EventTicker.tsx",
              '''  useEffect(() => {
            const controller = new AbortController();

            async function loadTicker() {
              try {
                const response = await fetch("/api/events/ticker", {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });

                if (!response.ok) {
                  setStatus("error");
                  return;
                }

                const payload = (await response.json()) as TickerPayload;
                setItems(Array.isArray(payload.items) ? payload.items : []);
                setStatus("ready");
              } catch (error) {
                if ((error as Error).name !== "AbortError") {
                  console.error("Failed to load event ticker", error);
                  setStatus("error");
                }
              }
            }

            loadTicker();

            return () => controller.abort();
          }, []);''',
              '''  useEffect(() => {
            let controller: AbortController | null = null;

            async function loadTicker() {
              controller?.abort();
              controller = new AbortController();

              try {
                const response = await fetch("/api/events/ticker", {
                  signal: controller.signal,
                  cache: "no-store",
                  headers: { Accept: "application/json" },
                });

                if (!response.ok) {
                  setStatus("error");
                  return;
                }

                const payload = (await response.json()) as TickerPayload;
                setItems(Array.isArray(payload.items) ? payload.items : []);
                setStatus("ready");
              } catch (error) {
                if ((error as Error).name !== "AbortError") {
                  console.error("Failed to load event ticker", error);
                  setStatus("error");
                }
              }
            }

            const reloadTicker = () => {
              void loadTicker();
            };
            const handleVisibilityChange = () => {
              if (document.visibilityState === "visible") {
                reloadTicker();
              }
            };

            reloadTicker();
            const pollTimer = window.setInterval(
              reloadTicker,
              EVENT_VISIBILITY_POLL_INTERVAL_MS,
            );
            window.addEventListener(EVENT_VISIBILITY_CHANGED_EVENT, reloadTicker);
            window.addEventListener("focus", reloadTicker);
            document.addEventListener("visibilitychange", handleVisibilityChange);

            return () => {
              controller?.abort();
              window.clearInterval(pollTimer);
              window.removeEventListener(EVENT_VISIBILITY_CHANGED_EVENT, reloadTicker);
              window.removeEventListener("focus", reloadTicker);
              document.removeEventListener("visibilitychange", handleVisibilityChange);
            };
          }, []);''',
          )

          replace_once(
              "components/events/RaidBossTicker.tsx",
              'import type { RaidBossTickerItem } from "../../lib/events";',
              '''import type { RaidBossTickerItem } from "../../lib/events";
          import {
            EVENT_VISIBILITY_CHANGED_EVENT,
            EVENT_VISIBILITY_POLL_INTERVAL_MS,
          } from "../../lib/event-visibility-client";''',
          )

          replace_once(
              "components/events/RaidBossTicker.tsx",
              '''  useEffect(() => {
            const controller = new AbortController();

            async function loadRaidBosses() {
              try {
                const response = await fetch("/api/events/raids", {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });

                if (!response.ok) {
                  setStatus("error");
                  return;
                }

                const payload = (await response.json()) as RaidTickerPayload;
                setItems(Array.isArray(payload.items) ? payload.items : []);
                setStatus("ready");
              } catch (error) {
                if ((error as Error).name !== "AbortError") {
                  console.error("Failed to load current raid bosses", error);
                  setStatus("error");
                }
              }
            }

            loadRaidBosses();

            return () => controller.abort();
          }, []);''',
              '''  useEffect(() => {
            let controller: AbortController | null = null;

            async function loadRaidBosses() {
              controller?.abort();
              controller = new AbortController();

              try {
                const response = await fetch("/api/events/raids", {
                  signal: controller.signal,
                  cache: "no-store",
                  headers: { Accept: "application/json" },
                });

                if (!response.ok) {
                  setStatus("error");
                  return;
                }

                const payload = (await response.json()) as RaidTickerPayload;
                setItems(Array.isArray(payload.items) ? payload.items : []);
                setStatus("ready");
              } catch (error) {
                if ((error as Error).name !== "AbortError") {
                  console.error("Failed to load current raid bosses", error);
                  setStatus("error");
                }
              }
            }

            const reloadRaidBosses = () => {
              void loadRaidBosses();
            };
            const handleVisibilityChange = () => {
              if (document.visibilityState === "visible") {
                reloadRaidBosses();
              }
            };

            reloadRaidBosses();
            const pollTimer = window.setInterval(
              reloadRaidBosses,
              EVENT_VISIBILITY_POLL_INTERVAL_MS,
            );
            window.addEventListener(
              EVENT_VISIBILITY_CHANGED_EVENT,
              reloadRaidBosses,
            );
            window.addEventListener("focus", reloadRaidBosses);
            document.addEventListener("visibilitychange", handleVisibilityChange);

            return () => {
              controller?.abort();
              window.clearInterval(pollTimer);
              window.removeEventListener(
                EVENT_VISIBILITY_CHANGED_EVENT,
                reloadRaidBosses,
              );
              window.removeEventListener("focus", reloadRaidBosses);
              document.removeEventListener("visibilitychange", handleVisibilityChange);
            };
          }, []);''',
          )

          replace_once(
              "pages/admin/events.tsx",
              '''import type { PokemonGoEventSummary } from "../../lib/events";
          import { getImportedEventsForAdmin } from "../../lib/events-server";''',
              '''import type { PokemonGoEventSummary } from "../../lib/events";
          import { notifyEventVisibilityChanged } from "../../lib/event-visibility-client";
          import { getImportedEventsForAdmin } from "../../lib/events-server";''',
          )
          replace_once(
              "pages/admin/events.tsx",
              '''      setMessage(payload.message);
              cancelEdit();''',
              '''      setMessage(payload.message);
              notifyEventVisibilityChanged();
              cancelEdit();''',
          )
          replace_once(
              "pages/admin/events.tsx",
              '''    setMessage(payload.message);

            if (editingEventID === eventID) {''',
              '''    setMessage(payload.message);
            notifyEventVisibilityChanged();

            if (editingEventID === eventID) {''',
          )
          replace_once(
              "pages/admin/events.tsx",
              "Hide this event immediately",
              "Hide this event immediately everywhere",
          )

          replace_once(
              "pages/admin/event-types.tsx",
              '''import type { PokemonGoEventSummary } from "../../lib/events";
          import { getImportedEventsForAdmin } from "../../lib/events-server";''',
              '''import type { PokemonGoEventSummary } from "../../lib/events";
          import { notifyEventVisibilityChanged } from "../../lib/event-visibility-client";
          import { getImportedEventsForAdmin } from "../../lib/events-server";''',
          )
          replace_once(
              "pages/admin/event-types.tsx",
              '''  function handleSaved(rule: EventTypeRule, nextMessage: string) {
            setRules((current) => [
              ...current.filter((item) => item.eventType !== rule.eventType),
              rule,
            ]);
            setMessage(nextMessage);
            setError(null);
          }''',
              '''  function handleSaved(rule: EventTypeRule, nextMessage: string) {
            setRules((current) => [
              ...current.filter((item) => item.eventType !== rule.eventType),
              rule,
            ]);
            setMessage(nextMessage);
            setError(null);
            notifyEventVisibilityChanged();
          }''',
          )
          replace_once(
              "pages/admin/event-types.tsx",
              '''  function handleReset(eventType: string, nextMessage: string) {
            setRules((current) =>
              current.filter((rule) => rule.eventType !== eventType),
            );
            setMessage(nextMessage);
            setError(null);
          }''',
              '''  function handleReset(eventType: string, nextMessage: string) {
            setRules((current) =>
              current.filter((rule) => rule.eventType !== eventType),
            );
            setMessage(nextMessage);
            setError(null);
            notifyEventVisibilityChanged();
          }''',
          )
          replace_once(
              "pages/admin/event-types.tsx",
              '''            Filter the imported feed by event type and hide whole categories such
                    as Hatch Days. Individual event overrides remain exceptions, so a
                    specific event redirected to Campfire can stay visible.''',
              '''            Filter the imported feed by event type and hide whole categories such
                    as Hatch Days. A hidden type is removed everywhere, including the events
                    page and both ticker bars, even when an individual event has an override.''',
          )

          replace_once(
              "pages/admin/content.tsx",
              '''import { getAllGuides, type GuideSummary } from "../../lib/guides";
          import { readLocalEvents, type LocalEvent } from "../../lib/local-events";''',
              '''import { getAllGuides, type GuideSummary } from "../../lib/guides";
          import { notifyEventVisibilityChanged } from "../../lib/event-visibility-client";
          import { readLocalEvents, type LocalEvent } from "../../lib/local-events";''',
          )
          replace_once(
              "pages/admin/content.tsx",
              '''      setMessage(payload.message);
            } catch (caught) {''',
              '''      setMessage(payload.message);
              notifyEventVisibilityChanged();
            } catch (caught) {''',
          )
          replace_once(
              "pages/admin/content.tsx",
              '''    setEvents((current) => current.filter((event) => event.id !== id));
            setMessage(payload.message);''',
              '''    setEvents((current) => current.filter((event) => event.id !== id));
            setMessage(payload.message);
            notifyEventVisibilityChanged();''',
          )

          Path(".github/workflows/apply-event-visibility-fix.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make event hiding global and refresh tickers"
          git push origin HEAD:fix/global-event-hiding
