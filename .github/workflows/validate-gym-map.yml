name: Validate gym map feature

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/gym-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gym-map
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final integration patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "components/gyms/GymMap.tsx",
              'import { useMemo, useState } from "react";',
              'import { Fragment, useEffect, useMemo, useState } from "react";',
          )
          replace_once(
              "components/gyms/GymMap.tsx",
              "  useMemo(() => {\n    if (selectedGym)",
              "  useEffect(() => {\n    if (selectedGym)",
          )
          replace_once(
              "components/gyms/GymMap.tsx",
              '<span key={gym.id}>',
              '<Fragment key={gym.id}>',
          )
          replace_once(
              "components/gyms/GymMap.tsx",
              "                </CircleMarker>\n              </span>",
              "                </CircleMarker>\n              </Fragment>",
          )

          replace_once(
              "pages/admin.js",
              'import { getServerSession } from "next-auth/next";',
              'import Link from "next/link";\nimport { getServerSession } from "next-auth/next";',
          )
          replace_once(
              "pages/admin.js",
              '          <NavButton id="searches">Saved search strings ({counts.searches})</NavButton>',
              '          <NavButton id="searches">Saved search strings ({counts.searches})</NavButton>\n          <Link href="/admin/gyms" className="admin-navbtn admin-navlink">\n            <span>Gym data</span>\n            <span className="admin-navbtn-caret">→</span>\n          </Link>',
          )
          replace_once(
              "pages/admin.js",
              "        .admin-navbtn:hover {",
              "        .admin-navlink {\n          box-sizing: border-box;\n          text-decoration: none;\n        }\n        .admin-navbtn:hover {",
          )
          PY

      - name: Update dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Remove generated build changes
        shell: bash
        run: |
          git restore --worktree --staged .next next-env.d.ts 2>/dev/null || true

      - name: Validate gym feature wiring
        shell: bash
        run: |
          npm ls csv-parse leaflet react-leaflet
          grep -q 'YYYY-MM-DD HH-mm-ss - gyms.csv' pages/admin/gyms.tsx
          grep -q 'Europe/London' pages/api/admin/gyms/upload.ts
          grep -q '/data/gym-imports/\*.csv' .gitignore
          grep -q '/data/gyms.json\*' .gitignore
          grep -q 'NewGymTicker' pages/_app.js
          grep -q 'session &&' components/Navbar.js
          grep -q 'Directions in Google Maps' components/gyms/GymMap.tsx
          grep -q 'initialImport ? null : importedAt' pages/api/admin/gyms/upload.ts
          grep -q 'previousById' pages/api/admin/gyms/upload.ts
          node <<'NODE'
          const { parse } = require('csv-parse/sync');
          const rows = parse('id,name,lat,lon,__typename\nabc,"Comma, Gym",53.5,-2.5,Gym\n', {
            columns: true,
            skip_empty_lines: true,
          });
          if (rows.length !== 1 || rows[0].name !== 'Comma, Gym') {
            throw new Error('CSV parser validation failed');
          }
          NODE

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json components/gyms/GymMap.tsx pages/admin.js
          if ! git diff --cached --quiet; then
            git commit -m "Finalize gym map integration [skip ci]"
            git push origin HEAD:feature/gym-map
          fi
