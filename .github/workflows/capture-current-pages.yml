name: Capture current pages

on:
  pull_request:
    branches: [develop]

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/screenshots.db
      NEXTAUTH_SECRET: current-page-screenshot-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma db push

      - name: Create temporary admin account
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const prisma = new PrismaClient();

          (async () => {
            const password = await bcrypt.hash('test', 10);
            await prisma.user.upsert({
              where: { ign: 'Angryspanner' },
              update: { password, role: 'admin' },
              create: {
                name: 'Angryspanner',
                ign: 'Angryspanner',
                password,
                role: 'admin',
              },
            });
          })().finally(() => prisma.$disconnect());
          NODE

      - name: Fetch live ScrapedDuck events
        run: |
          mkdir -p data
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/Drumstix42/ScrapedDuck/refs/heads/data/events.min.json');
            if (!response.ok) {
              throw new Error(`Event feed returned ${response.status} ${response.statusText}`);
            }

            const events = await response.json();
            fs.writeFileSync(
              'data/events-cache.json',
              JSON.stringify({ version: 1, fetchedAt: new Date().toISOString(), events }),
            );
            fs.writeFileSync('data/local-events.json', '[]\n');
          })();
          NODE

      - run: npm run build

      - name: Install Chromium capture tools
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start > /tmp/leighpogo.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leighpogo.log
          exit 1

      - name: Capture pages
        run: node .github/scripts/capture-current-pages.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: leighpogo-current-pages
          path: screenshots/*.png
          if-no-files-found: error
