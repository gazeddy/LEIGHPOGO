name: Validate populated Dynamax guide

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate guide sections
        run: |
          grep -q '^## Getting started$' content/guides/welcome.md
          grep -q '^## Max Particles and Power Spots$' content/guides/welcome.md
          grep -q '^## Powering up a Max Pokémon$' content/guides/welcome.md
          grep -q '^## Team roles$' content/guides/welcome.md
          grep -q '^## Battling$' content/guides/welcome.md
          grep -q '^## Picking teams$' content/guides/welcome.md
          grep -q '^## Useful links$' content/guides/welcome.md
          grep -q '1,500 MP' content/guides/welcome.md
          grep -q 'up to 20 Trainers' content/guides/welcome.md
