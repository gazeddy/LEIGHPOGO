name: Import SlimWiki Dynamax text

on:
  pull_request:
    branches: [develop]

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source page
        run: bash scripts/import-slimwiki-dynamax.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slimwiki-dynamax-source
          path: tmp/slimwiki-dynamax
