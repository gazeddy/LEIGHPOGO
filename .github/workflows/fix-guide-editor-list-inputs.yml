name: Correct guide editor list inputs

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/published-guide-editor

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Keep comma-separated inputs editable
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/admin/guide-images.tsx')
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              if old not in source:
                  raise SystemExit(f'{label} not found')
              source = source.replace(old, new, 1)

          replace_once(
              '  const [guide, setGuide] = useState<EditableGuide | null>(null);\n  const [loading, setLoading] = useState(false);',
              '  const [guide, setGuide] = useState<EditableGuide | null>(null);\n  const [eventTypesText, setEventTypesText] = useState("");\n  const [tagsText, setTagsText] = useState("");\n  const [loading, setLoading] = useState(false);',
              'Guide state block',
          )

          replace_once(
              '      setGuide(payload.guide as EditableGuide);',
              '      const loadedGuide = payload.guide as EditableGuide;\n      setGuide(loadedGuide);\n      setEventTypesText(loadedGuide.eventTypes.join(", "));\n      setTagsText(loadedGuide.tags.join(", "));',
              'Guide load block',
          )

          replace_once(
              '        body: JSON.stringify(guide),',
              '        body: JSON.stringify({\n          ...guide,\n          eventTypes: commaSeparatedValues(eventTypesText),\n          tags: commaSeparatedValues(tagsText),\n        }),',
              'Guide save payload',
          )

          replace_once(
              '      setGuide(payload.guide as EditableGuide);\n      setMessage(payload.message || "Published guide saved.");',
              '      const savedGuide = payload.guide as EditableGuide;\n      setGuide(savedGuide);\n      setEventTypesText(savedGuide.eventTypes.join(", "));\n      setTagsText(savedGuide.tags.join(", "));\n      setMessage(payload.message || "Published guide saved.");',
              'Guide save response',
          )

          event_pattern = re.compile(
              r'<input\s+value=\{guide\.eventTypes\.join\(", "\)\}\s+placeholder="max-battles, max-mondays"\s+onChange=\{\(event\) =>.*?\n\s*/>',
              re.S,
          )
          source, count = event_pattern.subn(
              '''<input
                  value={eventTypesText}
                  placeholder="max-battles, max-mondays"
                  onChange={(event) => setEventTypesText(event.target.value)}
                />''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Event types input block not found')

          tags_pattern = re.compile(
              r'<input\s+value=\{guide\.tags\.join\(", "\)\}\s+placeholder="max, dynamax, gigantamax"\s+onChange=\{\(event\) =>.*?\n\s*/>',
              re.S,
          )
          source, count = tags_pattern.subn(
              '''<input
                  value={tagsText}
                  placeholder="max, dynamax, gigantamax"
                  onChange={(event) => setTagsText(event.target.value)}
                />''',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Tags input block not found')

          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate list input behaviour
        run: |
          grep -q 'const \[eventTypesText, setEventTypesText\]' pages/admin/guide-images.tsx
          grep -q 'const \[tagsText, setTagsText\]' pages/admin/guide-images.tsx
          grep -q 'eventTypes: commaSeparatedValues(eventTypesText)' pages/admin/guide-images.tsx
          grep -q 'tags: commaSeparatedValues(tagsText)' pages/admin/guide-images.tsx
          ! grep -q 'value={guide.eventTypes.join' pages/admin/guide-images.tsx
          ! grep -q 'value={guide.tags.join' pages/admin/guide-images.tsx

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/admin/guide-images.tsx
          git commit -m "Keep guide metadata list inputs editable"
          git push origin HEAD:feature/published-guide-editor
