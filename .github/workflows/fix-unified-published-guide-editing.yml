name: Fix unified published guide editing

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-build-and-check:
    if: github.head_ref == 'fix/unified-published-guide-editing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-published-guide-editing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add direct published guide editing
        run: |
          python - <<'PY'
          from pathlib import Path

          editor_path = Path("pages/admin/content.tsx")
          editor = editor_path.read_text()

          if "initialGuide: EditableGuide | null;" not in editor:
              editor = editor.replace(
                  'import { getAllGuides, type GuideSummary } from "../../lib/guides";',
                  'import { getAllGuides, getGuideBySlug, type GuideSummary } from "../../lib/guides";',
                  1,
              )
              editor = editor.replace(
                  '''interface GuideEditorPageProps {
  initialGuides: GuideSummary[];
}
''',
                  '''interface GuideEditorPageProps {
  initialGuides: GuideSummary[];
  initialGuide: EditableGuide | null;
}
''',
                  1,
              )

              helper_anchor = '''export const getServerSideProps: GetServerSideProps<GuideEditorPageProps> = async (
'''
              helper = '''function editableGuideForSlug(slug: string): EditableGuide | null {
  const guide = getGuideBySlug(slug);

  if (!guide) {
    return null;
  }

  return {
    slug: guide.slug,
    title: guide.title,
    description: guide.description,
    date: guide.date?.slice(0, 10) ?? "",
    order: guide.order ?? null,
    eventTypes: guide.eventTypes ?? [],
    tags: guide.tags ?? [],
    series: guide.series ?? "",
    seriesOrder: guide.seriesOrder ?? null,
    relatedGuides: guide.relatedGuides ?? [],
    body: guide.content,
    coverImage: guide.coverImage ?? "",
    coverImageAlt: guide.coverImageAlt ?? "",
  };
}

'''
              if helper_anchor not in editor:
                  raise SystemExit("Guide editor SSR insertion point was not found")
              editor = editor.replace(helper_anchor, helper + helper_anchor, 1)

              old_props = '''  return {
    props: {
      initialGuides: getAllGuides(),
    },
  };
};
'''
              new_props = '''  const requestedSlug =
    typeof context.query.guide === "string" ? context.query.guide : "";

  return {
    props: {
      initialGuides: getAllGuides(),
      initialGuide: requestedSlug ? editableGuideForSlug(requestedSlug) : null,
    },
  };
};
'''
              if old_props not in editor:
                  raise SystemExit("Guide editor props block was not found")
              editor = editor.replace(old_props, new_props, 1)

              editor = editor.replace(
                  '''export default function GuideCreatorEditorPage({
  initialGuides,
}: InferGetServerSidePropsType<typeof getServerSideProps>) {
  const [guides, setGuides] = useState(initialGuides);
  const [selectedSlug, setSelectedSlug] = useState(NEW_GUIDE_VALUE);
  const [guide, setGuide] = useState<EditableGuide | null>(() => createBlankGuide());
  const [eventTypesText, setEventTypesText] = useState("");
  const [tagsText, setTagsText] = useState("");
  const [slugTouched, setSlugTouched] = useState(false);
''',
                  '''export default function GuideCreatorEditorPage({
  initialGuides,
  initialGuide,
}: InferGetServerSidePropsType<typeof getServerSideProps>) {
  const [guides, setGuides] = useState(initialGuides);
  const [selectedSlug, setSelectedSlug] = useState(
    initialGuide?.slug ?? NEW_GUIDE_VALUE,
  );
  const [guide, setGuide] = useState<EditableGuide | null>(() =>
    initialGuide ?? createBlankGuide(),
  );
  const [eventTypesText, setEventTypesText] = useState(
    initialGuide?.eventTypes.join(", ") ?? "",
  );
  const [tagsText, setTagsText] = useState(
    initialGuide?.tags.join(", ") ?? "",
  );
  const [slugTouched, setSlugTouched] = useState(Boolean(initialGuide));
''',
                  1,
              )

              editor_path.write_text(editor)

          guide_path = Path("pages/guides/[slug].tsx")
          guide_page = guide_path.read_text()

          if 'className="guide-admin-actions"' not in guide_page:
              guide_page = guide_page.replace(
                  'import Link from "next/link";\n',
                  'import Link from "next/link";\nimport { useSession } from "next-auth/react";\n',
                  1,
              )
              guide_page = guide_page.replace(
                  '''}: InferGetServerSidePropsType<typeof getServerSideProps>) {
  const hasSequence = previousGuide || nextGuide;
''',
                  '''}: InferGetServerSidePropsType<typeof getServerSideProps>) {
  const { data: session } = useSession();
  const isAdmin =
    (session?.user as { role?: string } | undefined)?.role === "admin";
  const hasSequence = previousGuide || nextGuide;
''',
                  1,
              )
              guide_page = guide_page.replace(
                  '''    >
      {seriesTitle && (
''',
                  '''    >
      {isAdmin && (
        <div className="guide-admin-actions">
          <Link
            href={{ pathname: "/admin/content", query: { guide: guide.slug } }}
          >
            Edit this guide
          </Link>
        </div>
      )}

      {seriesTitle && (
''',
                  1,
              )
              guide_page = guide_page.replace(
                  '''      <style jsx>{`
        .guide-cover {
''',
                  '''      <style jsx>{`
        .guide-admin-actions {
          display: flex;
          justify-content: flex-end;
          margin: 0 0 18px;
        }

        .guide-admin-actions a {
          border: 1px solid #238636;
          border-radius: 8px;
          padding: 8px 12px;
          background: rgba(35, 134, 54, 0.15);
          color: #7ee787;
          font-weight: 800;
          text-decoration: none;
        }

        .guide-admin-actions a:hover,
        .guide-admin-actions a:focus-visible {
          background: rgba(35, 134, 54, 0.3);
          outline: none;
        }

        .guide-cover {
''',
                  1,
              )
              guide_path.write_text(guide_page)

          for redirect_name in ("guide-images.tsx", "guide-links.tsx"):
              redirect_path = Path("pages/admin") / redirect_name
              redirect = redirect_path.read_text()
              if "context.query.slug" not in redirect:
                  old_return = '''  return {
    redirect: { destination: "/admin/content", permanent: false },
  };
'''
                  new_return = '''  const slug =
    typeof context.query.slug === "string" ? context.query.slug : "";

  if (slug) {
    return {
      redirect: {
        destination: `/admin/content?guide=${encodeURIComponent(slug)}`,
        permanent: false,
      },
    };
  }

  return {
    redirect: { destination: "/admin/content", permanent: false },
  };
'''
                  if old_return not in redirect:
                      raise SystemExit(f"Redirect block not found in {redirect_name}")
                  redirect_path.write_text(redirect.replace(old_return, new_return, 1))

          test_path = Path("__tests__/admin/unified-guide-editor.test.js")
          test = test_path.read_text()
          if "opens published guides directly in the unified editor" not in test:
              test = test.replace(
                  '''  const oldLinks = readSource("pages/admin/guide-links.tsx");
''',
                  '''  const oldLinks = readSource("pages/admin/guide-links.tsx");
  const publishedGuide = readSource("pages/guides/[slug].tsx");
''',
                  1,
              )
              insertion = '''
  it("opens published guides directly in the unified editor", () => {
    expect(editor).toContain("getGuideBySlug");
    expect(editor).toContain("initialGuide: EditableGuide | null");
    expect(editor).toContain("context.query.guide");
    expect(editor).toContain("initialGuide?.slug ?? NEW_GUIDE_VALUE");
    expect(publishedGuide).toContain('pathname: "/admin/content"');
    expect(publishedGuide).toContain("query: { guide: guide.slug }");
    expect(publishedGuide).toContain("Edit this guide");
  });

  it("preserves selected guides through legacy editor redirects", () => {
    expect(oldEditor).toContain("context.query.slug");
    expect(oldEditor).toContain("/admin/content?guide=");
    expect(oldLinks).toContain("context.query.slug");
    expect(oldLinks).toContain("/admin/content?guide=");
  });
'''
              test = test.replace(
                  '''  it("removes the local event creator surface and endpoint", () => {
''',
                  insertion + '''
  it("removes the local event creator surface and endpoint", () => {
''',
                  1,
              )
              test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted editor tests
        run: npm test -- --runInBand __tests__/admin/unified-guide-editor.test.js

      - name: Build application
        run: npm run build

      - name: Commit feature changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/admin/unified-guide-editor.test.js pages/admin/content.tsx pages/admin/guide-images.tsx pages/admin/guide-links.tsx pages/guides/'[slug].tsx'
          git commit -m "Fix editing of published guides"
          git push origin HEAD:fix/unified-published-guide-editing
