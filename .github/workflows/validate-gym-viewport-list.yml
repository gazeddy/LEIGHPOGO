name: Validate gym viewport list

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate viewport-driven gym list
        run: |
          grep -q 'const GYM_LIST_LIMIT = 15' components/gyms/GymMap.tsx
          grep -q 'useMapEvents' components/gyms/GymMap.tsx
          grep -q 'isInsideViewport' components/gyms/GymMap.tsx
          grep -q 'filteredGyms.map' components/gyms/GymMap.tsx
          grep -q 'onScreenGyms.length > GYM_LIST_LIMIT' components/gyms/GymMap.tsx
          grep -q 'showGymList && onScreenGyms.map' components/gyms/GymMap.tsx
          ! grep -q 'GYM_DISPLAY_LIMIT' components/gyms/GymMap.tsx
