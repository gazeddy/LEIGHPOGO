name: Validate team migration

on:
  pull_request:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./migration-test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build pre-migration database
        run: |
          set -euo pipefail
          target="prisma/migrations/20251218162628_move_team_to_entry"
          mv "$target" /tmp/move_team_to_entry
          npm run db:deploy
          mv /tmp/move_team_to_entry "$target"

      - name: Seed representative teams
        run: |
          sqlite3 prisma/migration-test.db <<'SQL'
          INSERT INTO User (id, name, ign, password, role, friendCode, team) VALUES
            (101, 'Mystic user', 'mystic-user', 'hash', 'user', '111122223333', 'MYSTIC'),
            (102, 'Valor user', 'valor-user', 'hash', 'user', '444455556666', 'VALOR'),
            (103, 'Instinct user', 'instinct-user', 'hash', 'user', '777788889999', 'INSTINCT');

          INSERT INTO Entry (id, trainerName, code, ownerId, createdAt, updatedAt) VALUES
            (201, 'mystic-user', '111122223333', 101, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
            (202, 'valor-user', '444455556666', 102, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
            (203, 'instinct-user', '777788889999', 103, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          SQL

      - name: Apply corrected migration
        run: npm run db:deploy

      - name: Verify teams were preserved
        run: |
          set -euo pipefail
          test "$(sqlite3 prisma/migration-test.db "SELECT team FROM Entry WHERE ownerId = 101;")" = "MYSTIC"
          test "$(sqlite3 prisma/migration-test.db "SELECT team FROM Entry WHERE ownerId = 102;")" = "VALOR"
          test "$(sqlite3 prisma/migration-test.db "SELECT team FROM Entry WHERE ownerId = 103;")" = "INSTINCT"
          test "$(sqlite3 prisma/migration-test.db "SELECT COUNT(*) FROM pragma_table_info('User') WHERE name IN ('team', 'friendCode');")" = "0"
          test "$(sqlite3 prisma/migration-test.db "PRAGMA foreign_key_check;")" = ""
          sqlite3 -header -column prisma/migration-test.db "SELECT ownerId, trainerName, team FROM Entry ORDER BY ownerId;"
