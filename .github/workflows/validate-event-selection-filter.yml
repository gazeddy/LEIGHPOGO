name: Validate event selection filter

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-ticker-links

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply event filter correction
        run: python scripts/fix-event-selection-filter.py

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate filter behaviour
        run: |
          grep -q 'selectedType !== "all"' pages/events/index.tsx
          grep -q 'router.replace("/events"' pages/events/index.tsx
          grep -q '\[selectedEventID, selectedType\]' pages/events/index.tsx
          ! grep -q '\[selectedEventID, visibleEvents\]' pages/events/index.tsx

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/events/index.tsx
          if git diff --cached --quiet; then
            echo "Correction is already committed."
          else
            git commit -m "Allow event filters after ticker selection"
            git push origin HEAD:feature/event-ticker-links
          fi
