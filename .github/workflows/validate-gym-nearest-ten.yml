name: Validate nearest gym map

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gym-map-nearest-ten

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate nearest-ten behaviour
        run: |
          grep -q 'const GYM_DISPLAY_LIMIT = 10' components/gyms/GymMap.tsx
          grep -q 'filteredGyms.slice(0, GYM_DISPLAY_LIMIT)' components/gyms/GymMap.tsx
          grep -q 'gyms={visibleGyms}' components/gyms/GymMap.tsx
          grep -q 'visibleGyms.map' components/gyms/GymMap.tsx
          grep -q 'Sorted from Leigh town centre' components/gyms/GymMap.tsx
