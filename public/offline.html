<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <title>LEIGHPOGO - Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #f0f6fc; padding: 24px; }
    main { width: min(520px, 100%); padding: 28px; border: 1px solid #30363d; border-radius: 16px; background: #161b22; text-align: center; }
    h1 { margin-top: 0; }
    p { color: #b1bac4; line-height: 1.5; }
    button { margin-top: 10px; border: 0; border-radius: 10px; background: #238636; color: white; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>LEIGHPOGO needs a connection for live community data, friend codes, trades, maps and notifications.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
